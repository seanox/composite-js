<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

      const nativeConsoleError = console.error;
      Test.activate();

      for (const [script, expected] of [["1 + 2", 3], ["{{1 + 2}}", 3]])
          Test.create({test() {
              const result = Expression.eval({}, script);
              Assert.assertUndefined(result.variable);
              Assert.assertEquals(expected, result.result);
          }});

      Test.create({test() {
          Assert.assertEquals(3, Expression.eval({}, " \t1 + 2\r\n").result);
          Assert.assertEquals(undefined, Expression.eval({}, " ").result);
          Assert.assertEquals(5, Expression.eval({}, "let value = 2; value + 3").result);
          Assert.assertEquals(3, Expression.eval({}, "1 /* } } { { */ + 2").result);
      }});

      Test.create({name: "Expressions provide the attempt helper without logging handled errors", test() {
          const errors = [];
          const original = console.error;
          console.error = error => errors.push(error);
          try {
              Assert.assertEquals(42,
                  Expression.eval({value: 42}, "attempt(() => value)").result);
              Assert.assertUndefined(
                  Expression.eval({}, "attempt(() => absentAttemptModel.value)").result);
              Assert.assertEquals(0, errors.length);
          } finally {
              console.error = original;
          }
      }});

      for (const [script, variable, expected] of [
          ["value", undefined, 7],
          ["value + 1", "answer", 8],
          ["value", "$", 7],
          ["value + 1", "$amount", 8],
          ["value", "item$2", 7],
          ["value", "__", 7],
          ["answer : value", undefined, 7],
          ["value ? 1 : 2", undefined, 1],
          ["({key: value}).key", undefined, 7],
          ["'left:right'", undefined, "left:right"],
          ["`value:${value}`", undefined, "value:7"],
          ["'left:right'", "answer", "left:right"],
          ["answer: 'a }} b'", undefined, "a }} b"],
          ["'a {{ b'", "answer", "a {{ b"],
          ["\r\n value + 1\n", "answer", 8],
          ["!false", "answer", true],
          ["\n", "answer", undefined],
          [String.raw`'line\nbreak'`, "answer", "line\nbreak"],
          ["`line\nbreak`", "answer", "line\nbreak"],
          [String.raw`"a \}\} b \{\{"`, undefined, "a }} b {{"],
          [String.raw`"a \}\} b \{\{"`, "answer", "a }} b {{"],
          ["({outer: {value: 3} }).outer.value", undefined, 3],
          ["({outer: {value: 3} }).outer.value", "answer", 3],
          ["value == 7", undefined, true],
          [String.raw`'line\nbreak'`, undefined, "line\nbreak"],
          ["`line\nbreak`", undefined, "line\nbreak"],
          ["value", "_1", 7]
      ])
          Test.create({test() {
              const context = {value:7};
              const evaluation = Expression.eval(context, variable, script);
              Assert.assertEquals(variable, evaluation.variable);
              Assert.assertEquals(expected, evaluation.result);
          }});

      Test.create({name: "Whitespace in JavaScript labels is preserved", test() {
          for (const whitespace of [" ", "\t", "\n", "\r", "\r\n", "\u2028", "\u2029"]) {
              const result = Expression.eval({value:7}, "answer" + whitespace + ": value");
              Assert.assertEquals(undefined, result.variable);
              Assert.assertEquals(7, result.result);
          }
      }});

      Test.create({name: "A comment before the colon is passed to JavaScript unchanged", test() {
          const original = Scripting.eval;
          const context = {value:7};
          Scripting.eval = (scope, script) => {
              Assert.assertSame(context, scope);
              Assert.assertEquals("answer/* comment */: value", script);
              return 7;
          };
          try {
              const result = Expression.eval(context, "answer/* comment */: value");
              Assert.assertEquals(undefined, result.variable);
              Assert.assertEquals(7, result.result);
          } finally {
              Scripting.eval = original;
          }
      }});

      Test.create({test() {
          for (const value of [undefined, null, false, 0, -0, NaN, "", [1, 2],
              {variable: "payload", result: 7}, Symbol("value"), () => 7])
              for (const prefix of [[], ["items"]])
                  Assert.assertTrue(Object.is(value, Expression.eval({value}, ...prefix, "value").result));
      }});

      for (const lineBreak of ["\n", "\r", "\r\n"])
          Test.create({test() {
              const script = "const amount = value; // Number of items" + lineBreak
                  + "amount * 3";
              for (const prefix of ["", "answer: "]) {
                  const expression = {variable: prefix ? "answer" : undefined, script};
                  for (const value of [2, 4]) {
                      const result = Expression.eval({value}, expression.variable, expression.script);
                      Assert.assertEquals(prefix ? "answer" : undefined, result.variable);
                      Assert.assertEquals(value * 3, result.result);
                  }
              }
          }});

      for (const lineBreak of ["\n", "\r", "\r\n"])
          for (const prefix of ["", "answer: "])
              Test.create({test() {
                  const errors = [];
                  const original = console.error;
                  console.error = error => errors.push(error);
                  try {
                      for (const quote of ["'", '"']) {
                          const script = quote + "line" + lineBreak + "break" + quote;
                          const result = Expression.eval({},
                              prefix ? "answer" : undefined, script);
                          Assert.assertEquals(prefix ? "answer" : undefined, result.variable);
                          Assert.assertTrue(result.result instanceof SyntaxError);
                      }
                  } finally {
                      console.error = original;
                  }
                  Assert.assertEquals(2, errors.length);
              }});

      Test.create({test() {
          Assert.assertEquals(1, Expression.eval({}, "1").result);
          let error;
          try {Expression.eval({}, {});
          } catch (caught) {
              error = caught;
          }
          Assert.assertTrue(error instanceof TypeError);
          Assert.assertEquals(2, Expression.eval({}, "2").result);
      }});

      Test.create({name: "Reused structures keep thrown values and log the prepared script", test() {
          const failures = [new Error("first failure"), new Error("second failure")];
          const expression = Object.freeze({variable: "value", script: "throw failure"});
          const errors = [];
          const original = console.error;
          console.error = (...variants) => errors.push(variants);
          try {
              for (const [index, failure] of failures.entries()) {
                  const result = Expression.eval({failure}, expression.variable, expression.script);
                  Assert.assertEquals("value", result.variable);
                  Assert.assertSame(failure, result.result);
                  Assert.assertEquals(index === 0 ? "first failure" : "second failure", failure.message);
              }
          } finally {
              console.error = original;
          }
          Assert.assertEquals(2, errors.length);
          for (const [index, variants] of errors.entries()) {
              Assert.assertEquals(2, variants.length);
              Assert.assertSame(failures[index], variants[0]);
              Assert.assertEquals("Error in expression: throw failure", variants[1]);
          }
      }});

      Test.create({name: "DOMException is returned without propagation", test() {
          const errors = [];
          const original = console.error;
          let result;
          console.error = (...variants) => errors.push(variants);
          try {result = Expression.eval({}, "document.querySelector('[')");
          } finally {
              console.error = original;
          }
          Assert.assertEquals(undefined, result.variable);
          Assert.assertTrue(result.result instanceof DOMException);
          Assert.assertEquals("SyntaxError", result.result.name);
          Assert.assertEquals(1, errors.length);
          Assert.assertEquals(2, errors[0].length);
          Assert.assertSame(result.result, errors[0][0]);
          Assert.assertEquals("Error in expression: document.querySelector('[')", errors[0][1]);
      }});

      const diagnosticAccesses = [];
      const messageGetter = new Error("failure");
      Object.defineProperty(messageGetter, "message", {
          get() {
              diagnosticAccesses.push("message getter");
              throw new Error("message access failed");
          },
          set() {diagnosticAccesses.push("message setter");}
      });
      const valueConversion = {
          toString() {
              diagnosticAccesses.push("value conversion");
              throw new Error("value conversion failed");
          }
      };
      const diagnosticConversion = new Error("diagnostic");
      diagnosticConversion.toString = () => {
          diagnosticAccesses.push("error conversion");
          throw new Error("diagnostic conversion failed");
      };
      const thrownValues = [
          undefined, null, false, true, 0, -0, NaN, "", "failure", Symbol("failure"),
          messageGetter, valueConversion, new Error("ordinary"),
          diagnosticConversion, Object.freeze(new Error("frozen"))
      ];
      thrownValues.forEach((failure, index) => {
          Test.create({name: "Thrown values are returned unchanged #" + (index +1), test() {
              const errors = [];
              const original = console.error;
              let result;
              console.error = (...variants) => errors.push(variants);
              try {result = Expression.eval({failure}, "throw failure");
              } finally {
                  console.error = original;
              }
              Assert.assertEquals(undefined, result.variable);
              Assert.assertTrue(Object.is(failure, result.result));
              Assert.assertEquals(1, errors.length);
              Assert.assertEquals(2, errors[0].length);
              Assert.assertTrue(Object.is(failure, errors[0][0]));
              Assert.assertEquals("Error in expression: throw failure", errors[0][1]);
              Assert.assertEquals(0, diagnosticAccesses.length);
          }});
      });

      Test.create({name: "Native console logging preserves thrown values", test() {
          const original = console.error;
          console.error = (...variants) => nativeConsoleError.apply(console, variants);
          try {
              for (const failure of thrownValues) {
                  const result = Expression.eval({failure}, "throw failure");
                  Assert.assertEquals(undefined, result.variable);
                  Assert.assertTrue(Object.is(failure, result.result));
              }
          } finally {
              console.error = original;
          }
          Assert.assertFalse(diagnosticAccesses.some(access => access.endsWith("setter")));
      }});

      Test.create({test() {
          const error = new Error("ordinary result");
          const errors = [];
          const original = console.error;
          console.error = value => errors.push(value);
          try {
              const result = Expression.eval({error}, "failure", "error");
              Assert.assertEquals("failure", result.variable);
              Assert.assertSame(error, result.result);
              Assert.assertEquals(0, errors.length);
          } finally {
              console.error = original;
          }
      }});

      Test.create({test() {
          const context = {
              script: "application script",
              _include: "application include",
              _expose: "application expose",
              _use: "application use"
          };
          Assert.assertEquals(3, Expression.eval(context, "1 + 2").result);
          Assert.assertEquals(
                  Object.values(context).join(","),
                  Expression.eval(context, "[script, _include, _expose, _use].join(',')").result
          );
          Assert.assertEquals(
                  "application script/application use",
                  Expression.eval(context, "script + '/' + _use").result
          );
          Assert.assertEquals(
                  "first",
                  Expression.eval({script: "first"}, "script").result
          );
          Assert.assertEquals(
                  "second",
                  Expression.eval({script: "second"}, "script").result
          );
      }});

      Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
