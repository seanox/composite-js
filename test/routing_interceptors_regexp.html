<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const _matches = [];
        const _navigate = path => new Promise(resolve => {
            const listener = event => {
                if (new URL(event.newURL, window.location.href).hash !== path)
                    return;
                window.removeEventListener("hashchange", listener);
                resolve();
            };
            window.addEventListener("hashchange", listener);
            Routing.route(path);
        });
        Routing.customize(/^#a/g, (oldHash, newHash) => {
            _matches.push("g" + newHash);
        });
        Routing.customize(/^#a/y, (oldHash, newHash) => {
            _matches.push("y" + newHash);
            return false;
        });
        Routing.customize("#a", () => false);

        Test.create({name:"Global RegExp interceptors match each navigation", test() {
            return _navigate("#a#1").then(() => _navigate("#a#2"))
                .then(() => _navigate("#a#3")).then(() =>
                    Assert.assertSameTo("script[type='text/test']", _matches.join("\r\n")));
        }});

        Test.create({name:"Frozen non-global RegExp interceptors remain usable", test() {
            let matched = false;
            Routing.customize(Object.freeze(/^#frozen$/), () => {
                matched = true;
                return false;
            });
            return _navigate("#frozen").then(() => Assert.assertTrue(matched));
        }});

        document.addEventListener("DOMContentLoaded", () => {
            window.setTimeout(() => Test.start(), 100);
        });
    </script>
    <script type="text/test">
      g#a#1
      y#a#1
      g#a#2
      y#a#2
      g#a#3
      y#a#3
    </script>
  </head>
  <body route>
  </body>
</html>
