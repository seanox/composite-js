<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        // Tests for invalid XML Locators
        Test.create({expected:/\bInvalid locator: xml/i, test() {
            DataSource.fetch("xml");
        }});
        Test.create({expected:/\bInvalid locator: xml:/i, test() {
            DataSource.fetch("xml:");
        }});
        Test.create({expected:/\bInvalid locator: xml:\//i, test() {
            DataSource.fetch("xml:/");
        }});
        Test.create({expected:/\bInvalid locator: xml:\/\//i, test() {
            DataSource.fetch("xml://");
        }});
        Test.create({expected:/\bInvalid locator: xml:\/\/\//i, test() {
            DataSource.fetch("xml:///");
        }});
        Test.create({expected:/\bHTTP status 404 for .*\/data\/xx\/b-b\.xml/i, test() {
            DataSource.fetch("xml:/b-b");
        }});

        // Test for valid XML Locators
        Test.create({test() {
            DataSource.fetch("xml:/locator_a");
            DataSource.fetch("xml:/b-b/locator_b");
            DataSource.fetch("xml:/data/xx/b-b/locator_b.xml");
            DataSource.fetch("xml:/data/xx/b-b/locator_b.xml?");
            DataSource.fetch("xml:/data/xx/b-b/locator_b.xml?//*");
            DataSource.fetch("xml:/data/xx/locator_a.xml");
            DataSource.fetch("xml:/data/xx/locator_a.xml?");
            DataSource.fetch("xml:/data/xx/locator_a.xml?//*");
            DataSource.fetch("xml://data/xx/locator_a.xml");
            DataSource.fetch("xml://data/xx/locator_a.xml?");
            DataSource.fetch("xml://data/xx/locator_a.xml?//*");
            DataSource.fetch("xml://data/xx/locator_a.xml?count(//*)");
        }});

        // Tests for invalid XSLT Locators
        Test.create({expected:/\bInvalid locator: xslt/i, test() {
            DataSource.fetch("xslt");
        }});
        Test.create({expected:/\bInvalid locator: xslt:/i, test() {
            DataSource.fetch("xslt:");
        }});
        Test.create({expected:/\bInvalid locator: xslt:\//i, test() {
            DataSource.fetch("xslt:/");
        }});
        Test.create({expected:/\bInvalid locator: xslt:\/\//i, test() {
            DataSource.fetch("xslt://");
        }});
        Test.create({expected:/\bInvalid locator: xslt:\/\/\//i, test() {
            DataSource.fetch("xslt:///");
        }});
        Test.create({expected:/\bHTTP status 404 for .*\/data\/xx\/b-b\.xslt/i, test() {
            DataSource.fetch("xslt:/b-b");
        }});

        Test.create({expected:/\bInvalid xslt locator: xslt:\/data\/xx\/b-b\/locator_b\.xslt\?\/\/\*/i, test() {
            DataSource.fetch("xslt:/data/xx/b-b/locator_b.xslt?//*");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/data\/xx\/locator_a\.xslt\?/i, test() {
            DataSource.fetch("xslt:/data/xx/locator_a.xslt?");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/data\/xx\/locator_a\.xslt\?\/\/\*/i, test() {
            DataSource.fetch("xslt:/data/xx/locator_a.xslt?//*");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/\/data\/xx\/locator_a\.xslt\?/i, test() {
            DataSource.fetch("xslt://data/xx/locator_a.xslt?");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/\/data\/xx\/locator_a\.xslt\?\/\/\*/i, test() {
            DataSource.fetch("xslt://data/xx/locator_a.xslt?//*");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/\/data\/xx\/locator_a\.xslt\?count\(\/\/\*\)/i, test() {
            DataSource.fetch("xslt://data/xx/locator_a.xslt?count(//*)");
        }});
        Test.create({expected:/\bInvalid xslt locator: xslt:\/data\/xx\/b-b\/locator_b\.xslt\?/i, test() {
            DataSource.fetch("xslt:/data/xx/b-b/locator_b.xslt?");
        }});

        // Test for valid XML Locators
        Test.create({test() {
            DataSource.fetch("xslt:/locator_a");
            DataSource.fetch("xslt:/b-b/locator_b");
            DataSource.fetch("xslt:/data/xx/b-b/locator_b.xslt");

            DataSource.fetch("xslt:/data/xx/locator_a.xslt");
            DataSource.fetch("xslt://data/xx/locator_a.xslt");
        }});

        Test.create({test() {
            Assert.assertNotNull(DataSource.fetch("xml:/data/xx/b-b/locator_b.xslt"));
            Assert.assertNotNull(DataSource.fetch("xml:/data/xx/b-b/xx/../locator_b.xslt"));
            Assert.assertNotNull(DataSource.fetch("xml:/data/xx/b-b/xx%2F..%2Flocator_b.xslt"));
        }});
        Test.create({test() {
            Assert.assertNotNull(DataSource.fetch("xslt:/data/xx/b-b/locator_b.xml"));
        }});

        Test.create({test() {
            const locator = Locator.parse(
                'xml:/data/xx/locator_a.xml?contains(., "100%25")');
            Assert.assertEquals(false, DataSource.fetch(locator.uri));
        }});

        Test.create({test() {
            Assert.assertEquals("percent literal", DataSource.fetch(
                "xml:/data/xx/locator%25literal.xml?string(/data)"));
        }});

        Test.create({test() {
            const source = "xml:/external.xml";
            const parse = Locator.parse;
            const open = XMLHttpRequest.prototype.open;
            const send = XMLHttpRequest.prototype.send;
            const requests = [];
            Locator.parse = () => ({
                schema: Locator.SCHEMA_XML,
                path: "/external.xml",
                uri: "xml:https://example.invalid/outside.xml",
                query: undefined
            });
            XMLHttpRequest.prototype.open = function(method, url, ...variants) {
                requests.push(String(url));
                return open.call(this, method, url, ...variants);
            };
            XMLHttpRequest.prototype.send = () => {};
            try {
                let error;
                try {
                    DataSource.fetch(source);
                } catch (exception) {
                    error = exception;
                }
                Assert.assertTrue(error instanceof Error);
                Assert.assertTrue(error.message.includes(source));
                Assert.assertEquals(0, requests.length);
            } finally {
                Locator.parse = parse;
                XMLHttpRequest.prototype.open = open;
                XMLHttpRequest.prototype.send = send;
            }
        }});

        Test.create({timeout:10000, async test() {
            const frame = document.createElement("iframe");
            document.body.appendChild(frame);
            try {
                await new Promise(resolve => {
                    frame.addEventListener("load", resolve, {once:true});
                    frame.src = "/example/datasource_context.html";
                });
                const probe = frame.contentWindow.__contextProbe;
                Assert.assertNotNull(probe);
                Assert.assertEquals("/example", probe.contextPath);
                Assert.assertEquals("inside application context", probe.resource);
                Assert.assertTrue(probe.traversalError.includes(
                    "xml:/attempted-traversal.xml"));
                Assert.assertTrue(probe.prefixError.includes(
                    "xml:/attempted-prefix.xml"));
                const paths = probe.requests.map(entry =>
                    new URL(entry.response || entry.request,
                        frame.contentWindow.location.href).pathname);
                Assert.assertTrue(paths.every(path =>
                    path === "/example" || path.startsWith("/example/")));
            } finally {
                frame.remove();
            }
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
