name: "Playwright: Tests"

on:
# disabled for cost reasons (free plan)
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Setup Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      - name: Build
        run: ant -f development compose
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: release/*.js
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: "Playwright: ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            engine: blink
            port: 8001
          - browser: firefox
            engine: gecko
            port: 8002
          - browser: webkit
            engine: webkit
            port: 8003

    steps:
      - name: Checkout current source
        uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: application-build
          path: release/
      - name: Copy build artifacts to test directory
        run: |
          cp release/composite-js-debug-testing.js test/
          cp release/composite-js-testing.js test/
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm dependencies
        working-directory: test/playwright
        run: npm install
      - name: Install Playwright browser
        working-directory: test/playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        working-directory: test/playwright
        run: |
          pwd
          ls -la .
          ls -la ..
          node runner.js -e ${{ matrix.engine }} -d .. -p ${{ matrix.port }}
