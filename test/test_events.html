<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const collector = [];

        [
            Test.EVENT_FINISH,
            Test.EVENT_INTERRUPT,
            Test.EVENT_PERFORM,
            Test.EVENT_RESPONSE,
            Test.EVENT_RESUME,
            Test.EVENT_START,
            Test.EVENT_SUSPEND
        ].forEach(name => {
            Test.listen(name, (event, status) => {
                if (status.queue)
                    collector.push("test " + event);
            });
            window.addEventListener(name, (event) => {
                if (event.type && event.type.startsWith("test"))
                    collector.push("window " + event.type);
            });
        });

        Test.create({test() {
            Assert.assertTrue(Test.EVENT_FINISH === "testFinish");
            Assert.assertTrue(Test.PATTERN_EVENT.test(Test.EVENT_FINISH));
            Assert.assertTrue(Test.PATTERN_EVENT.test("probe"));
        }});

        Test.create({test() {
            Assert.assertFalse(Test.PATTERN_EVENT.test("pr.be"));
            Assert.assertFalse(Test.PATTERN_EVENT.test("9robe"));
        }});

        // Errors in the listen/fire method must not prevent the following
        // events from being triggered.
        Test.listen("testTestEvent", () => {
            collector.push("test-A");
            throw new Error("Expected test error listener error");
        });
        Test.listen("testTestEvent", () => {
            collector.push("test-B");
            (null).substring(1);
        });
        Test.listen("testTestEvent", () => {
            collector.push("test-C");
            xxx.substring(1);
        });
        Test.listen("testTestEvent", () => {
            collector.push("test-D");
            if (xxx = xxx) return 123;
        });
        Test.listen("testTestEvent", () => {
            collector.push("test-E");
        });

        Test.create({test() {
            Test.fire("testTestEvent");
            console.debug(collector.join("\n"));
            const expected = document.querySelector("script[type='text/test']")
                .textContent.trim().split(/\r?\n/).map(line => line.trim()).join("\n");
            Assert.assertEquals(expected, collector.join("\n"));
        }});

        Test.create({name:"Composer window events preserve native payloads", test() {
            const name = "composerTestNativePayload";
            let forwarded;
            let forwardedTarget;
            const listener = event => {
                forwarded = event[name];
                forwardedTarget = forwarded.target;
            };
            window.addEventListener(name, listener);
            try {
                const target = document.createElement("div");
                const payload = new ProgressEvent("progress");
                target.addEventListener(payload.type, event => Composer.fire(name, event));
                target.dispatchEvent(payload);
                Assert.assertTrue(forwarded === payload);
                Assert.assertTrue(forwardedTarget === target);
            } finally {
                window.removeEventListener(name, listener);
            }
        }});

        Test.create({name:"Composer window events preserve positional payloads", test() {
            const name = "composerTestPositionalPayload";
            let forwarded;
            const listener = event => forwarded = event[name];
            window.addEventListener(name, listener);
            try {
                Composer.fire(name);
                Assert.assertUndefined(forwarded);
                const first = {first:1};
                [first, ["first", "second"], "failure", 0, false, null, undefined].forEach(payload => {
                    Composer.fire(name, payload);
                    Assert.assertTrue(forwarded === payload);
                });
                const second = {second:2};
                Composer.fire(name, first, second);
                Assert.assertTrue(Array.isArray(forwarded));
                Assert.assertEquals(2, forwarded.length);
                Assert.assertTrue(forwarded[0] === first);
                Assert.assertTrue(forwarded[1] === second);
            } finally {
                window.removeEventListener(name, listener);
            }
        }});

        Test.start({auto:true});
    </script>
    <script type="text/test">
      window testStart
      test testStart
      window testPerform
      test testPerform
      window testResponse
      test testResponse
      window testPerform
      test testPerform
      window testResponse
      test testResponse
      window testPerform
      test testPerform
      test-A
      test-B
      test-C
      test-D
      test-E
    </script>
  <head>
  <body>
  </body>
</html>
