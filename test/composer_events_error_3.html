    <script type="text/javascript">

        Test.activate();

        Test.listen("probe", () => {
            throw new Error("Expected Test frame listener error");
        });
        Test.listen("probe", () => {
            parent["probeCount"] += 1;
        });
        Test.fire("probe", {});

        Composer.listen(Composer.EVENT_ERROR, () => {
            throw new Error("Expected Composer error listener error");
        });
        Composer.listen(Composer.EVENT_ERROR, (type, event) => {
            document.body.textContent = "Event: " + event.message;
            parent["count"] += 1;
        });
