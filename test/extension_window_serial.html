<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
      iframe {
        height: 2em;
        overflow: hidden;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
      
        Test.activate();
      
        Test.create({test() {
            Assert.assertEquals(5, [...document.querySelectorAll("iframe")].length);
            const frames = [...document.querySelectorAll("iframe")];
            const distinctList = new Set();
            for (const frame of frames) {
                const content = frame.contentDocument.body.textContent.trim();
                distinctList.add(content);
                Assert.assertTrue(content.length > 0);
            }
            Assert.assertEquals(5, distinctList.size);
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
    <iframe id="Test1" src="extension_window_serial_frame.html"></iframe>
    <iframe id="Test2" src="extension_window_serial_frame.html"></iframe>
    <iframe id="Test3" src="extension_window_serial_frame.html"></iframe>
    <iframe id="Test4" src="extension_window_serial_frame.html"></iframe>
    <iframe id="Test5" src="extension_window_serial_frame.html"></iframe>
  </body>
</html>
