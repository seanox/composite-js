<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        // Scripting.eval - tolerate syntax
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>1 + 2))",
                    Scripting.eval("", {}, "(? 1 + 2)", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>unknownVariable))",
                    Scripting.eval("", {}, "(? unknownVariable)", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo.bar))",
                    Scripting.eval("", {}, "(? foo.bar)", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo()))",
                    Scripting.eval("", {}, "(? foo())", true)
            );
        }});

        // Simple tolerate expressions
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>1 + 2))\n//# sourceURL=scripting_eval.html",
                    Scripting.eval("scripting_eval.html", {}, "(? 1 + 2)", true)
                            .replaceAll(/[\r\n]+/g, "\n").trim()
            );
            Assert.assertEquals(
                    "(_tolerate(()=>unknownVariable))\n//# sourceURL=scripting_eval.html",
                    Scripting.eval("scripting_eval.html", {}, "(? unknownVariable)", true)
                            .replaceAll(/[\r\n]+/g, "\n").trim()
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo.bar))\n//# sourceURL=scripting_eval.html",
                    Scripting.eval("scripting_eval.html", {}, "(? foo.bar)", true)
                            .replaceAll(/[\r\n]+/g, "\n").trim()
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo()\n//# sourceURL=scripting_eval.html",
                    Scripting.eval("scripting_eval.html", {}, "(? foo()", true)
                            .replaceAll(/[\r\n]+/g, "\n").trim()
            );
        }});

        // Tolerate expressions with parentheses
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>(1 + 2) * 3))",
                    Scripting.eval("", {}, "(? (1 + 2) * 3)", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>Math.max(1, 2)))",
                    Scripting.eval("", {}, "(? Math.max(1, 2))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>Math.max(1, Math.min(2, 3))))",
                    Scripting.eval("", {}, "(? Math.max(1, Math.min(2, 3)))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo(bar(1, 2), baz(3))))",
                    Scripting.eval("", {}, "(? foo(bar(1, 2), baz(3)))", true)
            );
        }});

        // Nested tolerate expressions
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>1 + (_tolerate(()=>2 + 3))))",
                    Scripting.eval("", {}, "(? 1 + (? 2 + 3))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo((_tolerate(()=>bar.baz)))",
                    Scripting.eval("", {}, "(? foo((? bar.baz))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>1 + (_tolerate(()=>2 + (_tolerate(()=>3 + 4))))))",
                    Scripting.eval("", {}, "(? 1 + (? 2 + (? 3 + 4)))", true)
            );
        }});

        // Multiple tolerate expressions
        Test.create({test() {
            Assert.assertEquals(
                    "const a = (_tolerate(()=>unknownA));\n"
                    + "const b = (_tolerate(()=>unknownB));",
                    Scripting.eval(
                            "",
                            {},
                            "const a = (? unknownA);\n"
                            + "const b = (? unknownB);",
                            true
                    )
            );
            Assert.assertEquals(
                    "const a = (_tolerate(()=>foo)); const b = (_tolerate(()=>bar));",
                    Scripting.eval("", {}, "const a = (? foo); const b = (? bar);", true));
        }});

        // Tolerate with arrays
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>[1, 2, 3]))",
                    Scripting.eval("", {}, "(? [1, 2, 3])", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>[1, 2, foo.bar]))",
                    Scripting.eval("", {}, "(? [1, 2, foo.bar])", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>[foo(bar(1)), baz]))",
                    Scripting.eval("", {}, "(? [foo(bar(1)), baz])", true)
            );
        }});

        // Tolerate with object literals
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>({foo: 1, bar: 2})))",
                    Scripting.eval("", {}, "(? ({foo: 1, bar: 2}))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>({foo: bar.baz})))",
                    Scripting.eval("", {}, "(? ({foo: bar.baz}))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>({foo: {bar: baz}})))",
                    Scripting.eval("", {}, "(? ({foo: {bar: baz}}))", true)
            );
        }});

        // Tolerate with arrow functions
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>foo.map(value => value.bar)))",
                    Scripting.eval("", {}, "(? foo.map(value => value.bar))", true)
            );
            Assert.assertEquals(
                    "(_tolerate(()=>foo.map(value => ({value: value.bar}))))",
                    Scripting.eval("", {}, "(? foo.map(value => ({value: value.bar})))", true)
            );
        }});

        // Tolerate with multiline expressions
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>foo(\n    bar,\n    baz\n)))\n//# sourceURL=scripting_eval.html",
                    Scripting.eval(
                            "scripting_eval.html",
                            {},
                            "(? foo(\n"
                            + "    bar,\n"
                            + "    baz\n"
                            + "))",
                            true
                    ).replaceAll(/[\r\n]+/g, "\n").trim()
            );
            Assert.assertEquals(
                    "const value = (_tolerate(()=>foo(\n"
                    + "    bar,\n"
                    + "    baz\n"
                    + ")));\n"
                    + "return value;\n//# sourceURL=scripting_eval.html",
                    Scripting.eval(
                            "scripting_eval.html",
                            {},
                            "const value = (? foo(\n"
                            + "    bar,\n"
                            + "    baz\n"
                            + "));\n"
                            + "return value;",
                            true
                    ).replaceAll(/[\r\n]+/g, "\n").trim()
            );
        }});

        // Strings - tolerate syntax must be ignored
        Test.create({test() {
            Assert.assertEquals(
                    'const value = "(? foo.bar)";',
                    Scripting.eval("", {}, 'const value = "(? foo.bar)";', true)
            );
            Assert.assertEquals(
                    "const value = '(? foo.bar)';",
                    Scripting.eval("", {}, "const value = '(? foo.bar)';", true)
            );
            Assert.assertEquals(
                    "const value = `(? foo.bar)`;",
                    Scripting.eval("", {}, "const value = `(? foo.bar)`;", true)
            );
        }});

        // Comments - tolerate syntax must be ignored
        Test.create({test() {
            Assert.assertEquals(
                    "// (? foo.bar)\nconst value = 1;",
                    Scripting.eval(
                            "",
                            {},
                            "// (? foo.bar)\n"
                            + "const value = 1;",
                            true
                    )
            );
            Assert.assertEquals(
                    "/* (? foo.bar) */\nconst value = 1;",
                    Scripting.eval(
                            "",
                            {},
                            "/* (? foo.bar) */\n"
                            + "const value = 1;",
                            true
                    )
            );
            Assert.assertEquals(
                    "const value = 1; // (? foo.bar)",
                    Scripting.eval(
                            "",
                            {},
                            "const value = 1; // (? foo.bar)",
                            true
                    )
            );
        }});

        // #use
        Test.create({test() {
            Assert.assertEquals('_use(...["foo"])',
                    Scripting.eval("", {}, "#use foo", true)
            );
            Assert.assertEquals(
                    '_use(...["foo","bar"])',
                    Scripting.eval("", {}, "#use foo bar", true)
            );
            Assert.assertEquals(
                    '_use(...["foo"]);\n'
                    + 'const value = (_tolerate(()=>foo.bar));',
                    Scripting.eval(
                            "",
                            {},
                            "#use foo;\n"
                            + "const value = (? foo.bar);",
                            true
                    )
            );
        }});

        // #export
        Test.create({test() {
            Assert.assertEquals('_export(...[[value,"value"]])',
                    Scripting.eval("", {}, "#export value", true));
            Assert.assertEquals('_export(...[[value,"value","foo"]])',
                    Scripting.eval("", {}, "#export value@foo", true));
            Assert.assertEquals('_export(...[[foo,"foo"],[bar,"bar"]])',
                    Scripting.eval("", {}, "#export foo bar", true));
            Assert.assertEquals(
                    'const value = (_tolerate(()=>foo));\n'
                    + '_export(...[[value,"value"]])',
                    Scripting.eval(
                            "",
                            {},
                            "const value = (? foo);\n"
                            + "#export value",
                            true
                    )
            );
        }});

        // #import
        Test.create({test() {
            Assert.assertEquals('_import(...["foo"])',
                    Scripting.eval("", {}, "#import foo", true));
            Assert.assertEquals('_import(...["foo","bar"])',
                    Scripting.eval("", {}, "#import foo bar", true));
            Assert.assertEquals(
                    '_import(...["foo"]);\n'
                    + 'const value = (_tolerate(()=>foo.bar));',
                    Scripting.eval(
                            "",
                            {},
                            "#import foo;\n"
                            + "const value = (? foo.bar);",
                            true
                    )
            );
        }});

        // Combination of all macros
        Test.create({test() {
            Assert.assertEquals(
                    '_use(...["foo"]);\n'
                    + '_import(...["bar"]);\n'
                    + 'const value = (_tolerate(()=>foo.bar));\n'
                    + '_export(...[[value,"value"]])',
                    Scripting.eval(
                            "",
                            {},
                            "#use foo;\n"
                            + "#import bar;\n"
                            + "const value = (? foo.bar);\n"
                            + "#export value",
                            true
                    )
            );
        }});

        // Source URL / debug mode
        Test.create({test() {
            Assert.assertEquals(
                    "(_tolerate(()=>foo.bar))\n\n//# sourceURL=scripting_eval.html\n",
                    Scripting.eval(
                            "scripting_eval.html",
                            {},
                            "(? foo.bar)",
                            true
                    )
            );
            Assert.assertEquals(
                    "const value = 123;\n\n//# sourceURL=scripting_eval.html\n",
                    Scripting.eval(
                            "scripting_eval.html",
                            {},
                            "const value = 123;",
                            true
                    )
            );
        }});

        // No debug: script is actually executed
        Test.create({test() {
            Assert.assertEquals(3, Scripting.eval("scripting_eval.html", {}, "1 + 2"));
            Assert.assertEquals(3, Scripting.eval("scripting_eval.html", {}, "(? 1 + 2)"));
            Assert.assertEquals(undefined, Scripting.eval("scripting_eval.html", {}, "(? unknownVariable)"));
            Assert.assertEquals(123, Scripting.eval("scripting_eval.html", {}, "(? unknownVariable) || 123"));
        }});

        Test.start({auto:true});
    </script>
  <body>
  </body>
</html>
