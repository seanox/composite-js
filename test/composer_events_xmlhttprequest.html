<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const resource = "/resources/smile.png";
        const collector = [];

        [
            Composer.EVENT_HTTP_START,
            Composer.EVENT_HTTP_PROGRESS,
            Composer.EVENT_HTTP_RECEIVE,
            Composer.EVENT_HTTP_LOAD,
            Composer.EVENT_HTTP_ABORT,
            Composer.EVENT_HTTP_TIMEOUT,
            Composer.EVENT_HTTP_ERROR,
            Composer.EVENT_HTTP_END
        ].forEach(name => {
            Composer.listen(name, (event, meta) => {
                if (meta.type === "XMLHttpRequest"
                        && meta.url.startsWith(resource))
                    collector.push("composer " + event + " " + meta.url.replace(/\?.*$/, ""));
            });
            window.addEventListener(name, (event) => {
                const type = event.type;
                if (!type || !type.match(/^composer[A-Z]\w+$/i))
                    return;
                console.debug(event);
                const meta = event[type];
                if (!meta.type || meta.type !== "XMLHttpRequest" || !meta.url.startsWith(resource))
                    return;
                collector.push("window " + type + " " + meta.url.replace(/\?.*$/, ""));
            });
        });

        const request = new XMLHttpRequest();
        request.open("GET", resource + "?timing=" + Date.now());
        request.send();

        Test.create({test() {
            console.debug(collector.join("\n"));
            Assert.assertSameTo("script[type='text/test']", collector.join("\n"));
        }});

        Test.start({auto: true});
    </script>
    <script type="text/test">
      window composerHttpStart /resources/smile.png
      composer composerHttpStart /resources/smile.png
      window composerHttpReceive /resources/smile.png
      composer composerHttpReceive /resources/smile.png
      window composerHttpReceive /resources/smile.png
      composer composerHttpReceive /resources/smile.png
      window composerHttpReceive /resources/smile.png
      composer composerHttpReceive /resources/smile.png
      window composerHttpProgress /resources/smile.png
      composer composerHttpProgress /resources/smile.png
      window composerHttpReceive /resources/smile.png
      composer composerHttpReceive /resources/smile.png
      window composerHttpLoad /resources/smile.png
      composer composerHttpLoad /resources/smile.png
      window composerHttpEnd /resources/smile.png
      composer composerHttpEnd /resources/smile.png
    </script>
  </head>
  <body>
  </body>
</html>
