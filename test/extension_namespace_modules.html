<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
      }
      body div {
        margin: 1em;
      }
      body * {
        display: block;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const errors = [];
        Composer.listen(Composer.EVENT_ERROR, (event, error) => {
            if (error instanceof ReferenceError && String(error).includes("moduleE"))
                errors.push(error);
        });

        const snapshots = [];
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            const snapshot = document.body.textContent.trim();
            snapshots.push(snapshot);
            if (snapshots.length === 1)
                Test.start();
            if (snapshots.length >= 2)
                Assert.assertEquals("expected {1} steps but was {2}", 2, snapshots.length);
        });

        Test.create({test() {
            Assert.assertEquals("undefined", typeof moduleA);
            Assert.assertEquals("undefined", typeof moduleB);
            Assert.assertEquals("undefined", typeof moduleC);
            Assert.assertEquals("undefined", typeof moduleE);
        }});

        Test.create({test() {
            Assert.assertEquals("object", typeof moduleD);
            Assert.assertTrue(moduleD instanceof Element);
            Assert.assertEquals("object", typeof moduleF);
            Assert.assertEquals("F", moduleF.test);
            Assert.assertEquals("object", typeof moduleG);
            Assert.assertEquals("G", moduleG.test);
            Assert.assertEquals("object", typeof moduleH);
            Assert.assertUndefined(moduleH.test);
        }});

        Test.create({name:"Report the undeclared module reference to console without DOM error output", test() {
            Assert.assertEquals(1, errors.length);
            Assert.assertTrue(errors[0] instanceof ReferenceError);
            Assert.assertTrue(String(errors[0]).includes("moduleE"));
            const output = String(console.output.error);
            Assert.assertTrue(output.includes(Composer.MODULES + "/moduleK.js, ReferenceError"));
            Assert.assertEquals(2, output.split("ReferenceError").length -1);
            Assert.assertEquals(2, output.split("moduleE").length -1);
            Assert.assertFalse(document.body.innerText.includes(String(errors[0])));
        }});
    </script>
  </head>
  <body>
    ---
    <div id="moduleD" composite/>
    ---
    <div id="moduleK" composite/>
    ---
  </body>
</html>
