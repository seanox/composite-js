<!DOCTYPE html>
<html>
  <head>
    <title>Seanox composite-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
      }
      body div {
        display: inline;
      }
    </style>
    <script src="composite-js.js"></script>
    <script type="text/javascript">

        Test.activate();

        const state = {x: 10}.reactive();
        const result = {duration: ""}.reactive();

        let phase = 0;
        let timing;

        Composite.listen(Composite.EVENT_RENDER_END, () => {
            phase++;
            if (phase === 1) {
                timing = performance.now();
                state.x = 11;
            } else if (phase === 2) {
                const elapsed = performance.now() -timing;
                result.duration = `Duration ${elapsed.toFixed(0)} ms`;
                Test.create({test() {
                    const message = `${elapsed.toFixed(0)} ms`;
                    console.log(`Benchmark: ${message}`);
                }});
                Test.start();
            }
        });
    </script>
  </head>
  <body>
    Info: Output is hidden
    <div iterate="{{a:new Array(state.x)}}" style="display:none;">
      <div iterate="{{b:new Array(state.x)}}">
        <div iterate="{{c:new Array(state.x)}}">
          <div iterate="{{d:new Array(state.x)}}">
            {{a.index}}{{b.index}}{{c.index}}{{d.index}}
          </div>
        </div>
      </div>
    </div>
    <hr/>
    {{state.x}}
    <p id="duration">{{result.duration}}</p>
  </body>
</html>
