<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script src="assets/capture.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        const composeErrors = [];
        Composer.listen(Composer.EVENT_ERROR, (event, error) => {
            if (error instanceof TypeError && error.message === "Invalid require: undefined")
                composeErrors.push(error);
        });
        
        const urlMap = new Map();
        Composer.listen(Composer.EVENT_HTTP_END, (event, requestEvent) => {
            const request = requestEvent.target;
            let responseURL = request.responseURL;
            let sourceLocation = window.location.protocol + "//" + window.location.host + "/";
            if (responseURL.startsWith(sourceLocation)) {
                const filter = new RegExp("^.*?" + RegExp.quote(window.location.contextPath));
                responseURL = ("/" + responseURL.substring(sourceLocation.length -1).replace(filter, "")).replace(/^\/{2,}/, "/");
            }
            const key = responseURL + " " + request.status;
            if (!urlMap.has(key)
                    || !Array.isArray(urlMap.get(key)))
                urlMap.set(key, []);
            urlMap.get(key).push("X");
        });

        const aModel = {
            publishForm() {
                const form = document.createElement("form");
                const label = document.createElement("label");
                label.textContent = "Input";
                form.appendChild(label);
                const input = document.createElement("input");
                input.value = "123";
                input.type = "text";
                form.appendChild(input);
                const submit = document.createElement("input");
                submit.type = "submit";
                form.appendChild(submit);
                return form;
            },
            publishEmptyFragment() {
                return document.createDocumentFragment();
            },
            publishImg() {
                const img = document.createElement("img");
                img.src = "https://raw.githubusercontent.com/seanox/composite-js/master/test/resources/smile.png";
                return img;
            }
        };

        const capture = new Capture();
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            capture.snap();
            if (capture.snapshots().length === 9)
                Composer.render(document.body);
            if (capture.snapshots().length === 10)
                Composer.render(document.body);
        });

        const timeout = window.setInterval(() => {
            if (capture.snapshots().length !== capture.snapshots().ticks) {
              capture.snapshots().ticks = capture.snapshots().length;
                return;
            } else window.clearInterval(timeout);
            Test.start();
        }, 250);
      
        let xA = 5;
        let xB = 5;
        let xC = 5;
        let xX = 5;
        
        Test.create({test() {
            const text = document.body.textContent.replace(/^\s+/mg, "");
            Assert.assertTrue(text.includes("Summer-A"));
            Assert.assertTrue(text.includes("Summer-C"));
            Assert.assertFalse(text.includes("Summer-X"));
        }});
        Test.create({test() {
            const text = document.body.textContent.replace(/^\s+/mg, "");
            Assert.assertTrue(text.includes("resources/__import_a.htmlx"));
            Assert.assertTrue(text.includes("resources/__import_b.htmlx"));
            Assert.assertTrue(text.includes("resources/__import_o.htmlx"));
            Assert.assertTrue(text.includes("https://raw.githubusercontent.com/seanox/composite-js/master/CHANGES"));
        }});
        Test.create({test() {
            Assert.assertNotNull(document.querySelector("img"));
        }});
        Test.create({test() {
            Assert.assertNotNull(document.querySelector("form input[type='submit']"));
        }});
        Test.create({test() {
            Assert.assertEquals("", document.getElementById("emptyFragmentImport").textContent);
        }});
        
        Test.create({test() {
            Assert.assertEquals(1, moduleA$count);
        }});
        Test.create({test() {
            Assert.assertEquals(1, moduleB$count);
        }});
        Test.create({test() {
            Assert.assertEquals(1, moduleC$count);
        }});
        Test.create({test() {
            Assert.assertEquals(1, moduleX$count);
        }});
        Test.create({test() {
            let styles = document.querySelectorAll("html > head > style[type='text/css']");
            styles = Array.from(styles);
            let stylesA = styles.filter(entry => entry.textContent.includes("moduleA"));
            Assert.assertEquals(1, stylesA.length);
            // The following modules was loaded as a JavaScript import and
            // therefore no CSS is included.
            let stylesB = styles.filter(entry => entry.textContent.includes("moduleB"));
            Assert.assertEquals(0, stylesB.length);
            let stylesC = styles.filter(entry => entry.textContent.includes("moduleC"));
            Assert.assertEquals(0, stylesC.length);
            let stylesX = styles.filter(entry => entry.textContent.includes("moduleX"));
            Assert.assertEquals(0, stylesX.length);
        }});

        Test.create({test() {
            Assert.assertEquals(undefined, Composer.load(Composer.MODULES + "/io/moduleE.js"));
        }});

        Test.create({test() {
            Assert.assertEquals(undefined, Composer.load(Composer.MODULES + "/io/moduleY.js"));
        }});

        Test.create({test() {
            // To control the events, a resource is manually loaded multiple times.
            // Modules should be loaded once.
            const request = new XMLHttpRequest();
            request.open("GET", "nix.xxx", false);
            request.send();
            request.open("GET", "nix.xxx", false);
            request.send();
            request.open("GET", "nix.xxx", false);
            request.send();

            let result = "";
            for (const [key, value] of urlMap)
                result += "\r\n" + key + " " + value.join("");

            try {Assert.assertSameTo("script[type='text/test']", result);
            } catch (error) {
                console.log(result);
                throw error;
            }
        }});

        Test.create({test() {
            Assert.assertEquals(1, composeErrors.length);
            Assert.assertEquals("", document.getElementById("moduleF").innerText);
        }});

        Test.create({name:"Log expected import and composite errors to the console", test() {
            const output = String(console.output.error);
            Assert.assertEquals(1, output.split("/resources/import_o.htmlx").length -1);
            Assert.assertTrue(output.includes("Error: HTTP status 404 for "));
            Assert.assertTrue(output.includes(Composer.MODULES + "/moduleF.js, "
                + "TypeError: Invalid require: undefined"));
            const failure = "TypeError: Invalid require: undefined";
            Assert.assertEquals(2, output.split(failure).length -1);
        }});

        Test.create({test() {
            Assert.assertEquals(2, _error_collector.length);
            Assert.assertNotEquals(_error_collector[0], _error_collector[1]);
            Assert.assertTrue(_error_collector[0].startsWith("Error: HTTP status 404"));
            Assert.assertTrue(_error_collector[0].endsWith("/modules/io/moduleY.js"));
            Assert.assertTrue(_error_collector[1].startsWith("Error: HTTP status 404"));
            Assert.assertTrue(_error_collector[1].endsWith("/modules/nix/nix/nix.js"));
        }});

        const _error_collector = [];
    </script>
