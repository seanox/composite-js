<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        Test.create({name:"DataSource selects the default from its available locales", test() {
            Assert.assertEquals("xx", DataSource.locale);
            Assert.assertEquals("xx", DataSource.locales[0]);
            ["xx", "xde", "xen"].forEach(locale =>
                Assert.assertTrue(DataSource.locales.includes(locale)));
        }});

        Test.create({name:"localize selects available locales and normalizes case and whitespace", test() {
            const locale = DataSource.locale;
            try {
                [["xde", "xde"], [" XEN ", "xen"], ["xx", "xx"]].forEach(([input, expected]) => {
                    DataSource.localize(input);
                    Assert.assertEquals(expected, DataSource.locale);
                });
            } finally {
                DataSource.localize(locale);
            }
        }});
        
        [
            ["xxx", /\bLocale not available/i],
            ["", /\bLocale not available/i],
            [" ", /\bLocale not available/i],
            [undefined, /\bInvalid locale: undefined/i],
            [null, /\bInvalid locale: object/i]
        ].forEach(([locale, expected]) =>
            Test.create({name:"localize rejects " + JSON.stringify(locale), expected, test() {
                DataSource.localize(locale);
            }}));
        
        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
