<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-debug-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        // Tokens preserve bracket and quote notation. Literal contents are
        // decoded once, after splitting; decoded characters are never syntax.
        // Numeric ranges and object creation are outside this contract.
        const assertTokens = (path, expected) => {
            const actual = ___object_path_split(path);
            Assert.assertTrue(Array.isArray(actual));
            Assert.assertEquals(JSON.stringify(expected), JSON.stringify(actual));
        };

        const assertInvalid = path => {
            let error;
            try {___object_path_split(path);
            } catch (caught) {
                error = caught;
            }
            Assert.assertTrue(error instanceof SyntaxError);
            Assert.assertEquals("Invalid object path: " + path, error.message);
        };

        Test.create({name: "Private splitter is available in the debug build", test() {
            Assert.assertEquals("function", typeof ___object_path_split);
        }});

        [
            ["a", ["a"]],
            ["_", ["_"]],
            ["$", ["$"]],
            ["_a0.$items.A_Z", ["_a0", "$items", "A_Z"]],
            ["a.b.c", ["a", "b", "c"]],
            ["null.true.this", ["null", "true", "this"]],
            ["a.__proto__.constructor", ["a", "__proto__", "constructor"]],
            ["[property]", ["[property]"]],
            ["a[property]", ["a", "[property]"]],
            ["a[undefined][false][NaN]", ["a", "[undefined]", "[false]", "[NaN]"]],
            ["a[12]", ["a", "[12]"]],
            ["[0]", ["[0]"]],
            ["[12][0].child", ["[12]", "[0]", "child"]],
            ['a.b[12]["test"].d.f', ["a", "b", "[12]", '["test"]', "d", "f"]],
            ["a[b][0].c[d]", ["a", "[b]", "[0]", "c", "[d]"]],
            ['"root".child', ['"root"', "child"]],
            ['["root"].child', ['["root"]', "child"]],
            ['a."b.c"', ["a", '"b.c"']],
            ['"root"[12]."child.name"', ['"root"', "[12]", '"child.name"']],
            ['a["12"][12]', ["a", '["12"]', "[12]"]]
        ].forEach(([path, expected]) => {
            Test.create({name: "Path notation: " + JSON.stringify(path), test() {
                assertTokens(path, expected);
            }});
        });

        ["0", "00", "00012", "4294967294", "4294967295",
            "9007199254740993", "9".repeat(100)].forEach(index => {
            Test.create({name: "Numeric spelling is preserved: " + index, test() {
                assertTokens("a[" + index + "]", ["a", "[" + index + "]"]);
            }});
        });

        [" ", "\t", "\r", "\n", "\r\n", "\u00a0", "\u2028", "\u2029"]
            .forEach(padding => {
                ["property", "12", '"a.b [ c ]"'].forEach(content => {
                    Test.create({name: "Bracket padding: "
                            + JSON.stringify([padding, content]), test() {
                        assertTokens("a[" + padding + content + padding + "].b",
                            ["a", "[" + content + "]", "b"]);
                    }});
                });
            });

        const delimiters = ['"', "'", "`"];
        const contents = [
            "", "property", "123abc", "12", "-1", "1.5", "a.b", "a[b]",
            "[[]]", "a b", " a ", "\t", "\r\n", "\u2028", "\u2029",
            "gr\u00f6\u00dfe", "\u4e2d\u6587", "\ud83d\ude00",
            "__proto__", "constructor", "a/bc", "a?.b", "${call()}",
            "call(); throw new Error()",
            "\0", "\0" + "0" + "\0", "\0" + "1" + "\0",
            "\0" + "12" + "\0", "a\0.b[\0]c"
        ];
        const escapes = [
            ["\\b", "\b"], ["\\f", "\f"], ["\\n", "\n"],
            ["\\r", "\r"], ["\\t", "\t"], ["\\v", "\v"],
            ["\\0", "\0"], ["\\7", String.fromCharCode(7)], ["\\10", "\b"],
            ["\\123", "S"], ["\\777", String.fromCharCode(511)],
            ["\\1234", "S4"], ["\\x00", "\0"], ["\\x41", "A"],
            ["\\xE9", "\u00e9"], ["\\u0000", "\0"], ["\\u0041", "A"],
            ["\\u00f6", "\u00f6"], ["\\uD800", "\ud800"],
            ["\\uDC00", "\udc00"], ["\\uD83D\\uDE00", "\ud83d\ude00"],
            ["\\u00410", "A0"], ["\\u{0}", "\0"], ["\\u{41}", "A"],
            ["\\u{1F600}", "\ud83d\ude00"],
            ["\\u{10FFFF}", String.fromCodePoint(0x10FFFF)],
            ["\\q", "q"], ["\\8", "8"], ["\\9", "9"], ["a/b\\c", "a/bc"],
            ["\\\\", "\\"], ["\\/", "/"], ["\\.", "."],
            ["\\[", "["], ["\\]", "]"], ["\\\"", "\""],
            ["\\'", "'"], ["\\`", "`"],
            ["\\056\\133\\135\\042\\047\\140", ".[]\"'`"],
            ["\\x2e\\x5b\\x5d\\x22\\x27\\x60", ".[]\"'`"],
            ["\\u002e\\u005b\\u005d\\u0022\\u0027\\u0060", ".[]\"'`"],
            ["\\u{2e}\\u{5b}\\u{5d}\\u{22}\\u{27}\\u{60}", ".[]\"'`"],
            ["\\134", "\\"], ["\\x5c", "\\"],
            ["\\u005c", "\\"], ["\\u{5c}", "\\"],
            ["\\134n", "\\n"], ["\\x5cn", "\\n"],
            ["\\u005cn", "\\n"], ["\\u{5c}n", "\\n"],
            ["\\x5cu0041", "\\u0041"], ["\\u005cx4", "\\x4"],
            ["\\\\x4", "\\x4"], ["\\\\u{110000}", "\\u{110000}"],
            ["\\x000\\x00", "\0" + "0" + "\0"],
            ["\\u00001\\u0000", "\0" + "1" + "\0"],
            ["\\u{0}12\\u{0}", "\0" + "12" + "\0"],
            ["\0" + "0" + "\0\\n", "\0" + "0" + "\0\n"],
            ["prefix:\\0\\t\\x41\\u0042\\u{1F600}\\n:suffix",
                "prefix:\0\tAB\ud83d\ude00\n:suffix"],
            ["a\\\nb", "a\nb"], ["a\\\r\nb", "a\r\nb"]
        ];
        delimiters.forEach(delimiter => {
            contents.forEach(content => {
                const literal = delimiter + content + delimiter;
                Test.create({name: "Opaque literal: " + JSON.stringify(literal), test() {
                    assertTokens(literal, [literal]);
                    assertTokens("a[" + literal + "].b",
                        ["a", "[" + literal + "]", "b"]);
                    assertTokens("a." + literal, ["a", literal]);
                }});
            });

            escapes.forEach(([content, decoded]) => {
                const literal = delimiter + content + delimiter;
                const expected = delimiter + decoded + delimiter;
                Test.create({name: "Decoded literal: " + JSON.stringify(literal), test() {
                    assertTokens(literal, [expected]);
                    assertTokens("[" + literal + "].b", ["[" + expected + "]", "b"]);
                    assertTokens("a[" + literal + "].b",
                        ["a", "[" + expected + "]", "b"]);
                    assertTokens("a." + literal, ["a", expected]);
                }});
            });

            delimiters.filter(other => other !== delimiter).forEach(other => {
                const literal = delimiter + "a" + other + ".b[c]" + other + delimiter;
                Test.create({name: "Other delimiters inside a literal: "
                        + JSON.stringify(literal), test() {
                    assertTokens("a[" + literal + "]", ["a", "[" + literal + "]"]);
                }});

                const backslashes = delimiter + "a\\" + other + ".b[c]\\" + other + delimiter;
                const decoded = delimiter + "a" + other + ".b[c]" + other + delimiter;
                Test.create({name: "Backslashes before other delimiters are decoded: "
                        + JSON.stringify(backslashes), test() {
                    assertTokens("a[" + backslashes + "]",
                        ["a", "[" + decoded + "]"]);
                }});
            });

            [0, 1, 2, 3, 4, 5, 6, 7, 8].forEach(count => {
                const literal = delimiter + "tail" + "\\".repeat(count) + delimiter;
                const decoded = delimiter + "tail" + "\\".repeat(Math.floor(count /2)) + delimiter;
                Test.create({name: "Backslash parity before the closing delimiter: "
                        + JSON.stringify(literal), test() {
                    if (count %2) {
                        assertInvalid(literal);
                        assertInvalid("a[" + literal + "].b");
                        assertInvalid("a." + literal);
                    } else {
                        assertTokens(literal, [decoded]);
                        assertTokens("a[" + literal + "].b",
                            ["a", "[" + decoded + "]", "b"]);
                        assertTokens("a." + literal, ["a", decoded]);
                    }
                }});
            });

            [1, 2, 3, 4, 5, 6, 7, 8].forEach(count => {
                const literal = delimiter + "say" + "\\".repeat(count)
                    + delimiter + ".hi[12]" + delimiter;
                const decoded = delimiter + "say" + "\\".repeat(Math.floor(count /2))
                    + delimiter + ".hi[12]" + delimiter;
                Test.create({name: "Backslash parity before an embedded delimiter: "
                        + JSON.stringify(literal), test() {
                    if (count %2) {
                        assertTokens(literal, [decoded]);
                        assertTokens("a[" + literal + "].b",
                            ["a", "[" + decoded + "]", "b"]);
                        assertTokens("a." + literal, ["a", decoded]);
                    } else {
                        assertInvalid(literal);
                        assertInvalid("a[" + literal + "].b");
                        assertInvalid("a." + literal);
                    }
                }});
            });

            const repeated = delimiter + "say\\" + delimiter
                + "hi\\" + delimiter + "again" + delimiter;
            const decoded = delimiter + "say" + delimiter
                + "hi" + delimiter + "again" + delimiter;
            Test.create({name: "Multiple matching delimiters can be escaped: "
                    + JSON.stringify(repeated), test() {
                assertTokens("a[" + repeated + "].b", ["a", "[" + decoded + "]", "b"]);
            }});

            [
                ["0", "\0"], ["123", "S"], ["x41", "A"], ["u0041", "A"],
                ["u{41}", "A"], ["t", "\t"], ["q", "q"],
                [".", "."], ["[", "["], ["]", "]"]
            ].forEach(([escape, decoded]) => {
                for (let count = 2; count <= 8; count++) {
                    const literal = delimiter + "\\".repeat(count) + escape + delimiter;
                    const expected = delimiter + "\\".repeat(Math.floor(count /2))
                        + (count %2 ? decoded : escape) + delimiter;
                    Test.create({name: "Escape parity: " + JSON.stringify(literal), test() {
                        assertTokens("a[" + literal + "].b",
                            ["a", "[" + expected + "]", "b"]);
                    }});
                }
            });

            [
                "\\x", "\\x4", "\\xGG", "\\x4G",
                "\\u", "\\u0", "\\u00", "\\u000", "\\u00GG",
                "\\u{}", "\\u{", "\\u{41", "\\u{XYZ}", "\\u{-1}",
                "\\u{0000041}", "\\u{41X}"
            ].forEach(escape => {
                const literal = delimiter + escape + delimiter;
                Test.create({name: "Malformed literal escape: " + JSON.stringify(literal),
                        expected: SyntaxError, test() {
                    ___object_path_split("a[" + literal + "].b");
                }});
            });

            ["\\u{110000}", "\\u{FFFFFF}"].forEach(escape => {
                const literal = delimiter + escape + delimiter;
                Test.create({name: "Out-of-range literal escape: " + JSON.stringify(literal),
                        expected: RangeError, test() {
                    ___object_path_split("a[" + literal + "].b");
                }});
            });
        });

        Test.create({name: "JavaScript string escaping is separate from path grammar", test() {
            const withoutBackslash = 'a["x\"z"]';
            const withBackslash = 'a["x\\"z"]';
            Assert.assertEquals('a["x"z"]', withoutBackslash);
            Assert.assertEquals('a["x' + "\\" + '"z"]', withBackslash);
            assertInvalid(withoutBackslash);
            assertTokens(withBackslash, ["a", '["x"z"]']);
            assertTokens("a['x\"z']", ["a", "['x\"z']"]);
        }});

        [
            "", " ", "\t", ".", "..", ".a", "a.", "a..b",
            "12", "12a", "a.12", "a.12b", "a.1 2",
            "gr\u00f6\u00dfe", "a.gr\u00f6\u00dfe", "a[gr\u00f6\u00dfe]",
            "\\u0061", "a.\\u0062", "\\x61", "a.\\u{62}",
            "a\\u002eb", "a\\x5b0\\x5d", "a[\\u0030]",
            "a-b", "a/b", "a\\b", "a:b",
            "a\\.b", "a\\[0\\]", "a[\\b]", "a[\\12]", "a\\",
            "a[]", "a[ ]", "a[\t]", "a[.]", "a[-1]", "a[+1]", "a[1.5]",
            "a[1e2]", "a[0x10]", "a[0b10]", "a[1_000]", "a[1n]",
            "a[b.c]", "a[a[0]]", "a[b c]", "a[1 2]", "a[b,c]",
            'a["b" "c"]', 'a["b"+"c"]', "a[b+c]",
            "a[call()]", "a[true ? b : c]", "a?.b", "a?.[0]",
            'a"b"', '"a""b"', "a[b]c", "[a][b]c",
            "a.[b]", "a.[0]", 'a.["b"]', "a[0].",
            "a[", "a]", "a[b", "a[b]]", "a[[b]]",
            'a["b]', "a['b]", "a[`b]", '"a', "'a", "`a",
            "a[/*comment*/b]", "a/*comment*/.b", "a;b",
            "a.b = c", "a.b()", "a\nb", "a\rb"
        ].forEach(path => {
            Test.create({name: "Invalid grammar: " + JSON.stringify(path), test() {
                assertInvalid(path);
            }});
        });

        [" ", "\t", "\r", "\n", "\r\n", "\u00a0", "\u2028", "\u2029"]
            .forEach(padding => {
                [padding + "a", "a" + padding, "a" + padding + ".b",
                    "a." + padding + "b", "a" + padding + "[0]",
                    "a[0]" + padding + "[1]"].forEach(path => {
                    Test.create({name: "Whitespace outside brackets and literals: "
                            + JSON.stringify(path), test() {
                        assertInvalid(path);
                    }});
                });
            });

        const invalidNulPaths = ["\0", "a\0", "a.\0", "a[\0]", "a\0b",
            "a[\0" + "1" + "\0]", "\0" + "12" + "\0"];
        invalidNulPaths.forEach(path => {
            Test.create({name: "Diagnostics preserve the original NUL path: "
                    + JSON.stringify(path), test() {
                assertInvalid(path);
            }});
        });

        [undefined, null, false, true, 0, 12, NaN, Infinity, BigInt(1),
            Symbol("path"), {}, [], ["a"], new String("a"), () => {}].forEach((value, index) => {
            Test.create({name: "Invalid input type #" + (index +1),
                    expected: TypeError, test() {
                ___object_path_split(value);
            }});
        });

        Test.create({name: "Literal token indices with multiple digits", test() {
            const expected = Array.from({length: 32}, (_, index) =>
                "[" + delimiters[index %delimiters.length] + "key." + index
                    + delimiters[index %delimiters.length] + "]");
            assertTokens("a" + expected.join(""), ["a", ...expected]);
        }});

        Test.create({name: "Long identifier path", test() {
            const expected = Array.from({length: 512}, (_, index) => "level" + index);
            assertTokens(expected.join("."), expected);
        }});

        Test.create({name: "Each call returns an independent result", test() {
            const first = ___object_path_split('a["first.key"]');
            first[0] = "changed";
            first.push("extra");
            assertTokens('a["second.key"]', ["a", '["second.key"]']);
            assertTokens('a["first.key"]', ["a", '["first.key"]']);
        }});

        Test.create({name: "Rejected input does not affect subsequent calls", test() {
            assertInvalid('a["masked.key"].');
            assertTokens('a["valid.key"]', ["a", '["valid.key"]']);
        }});

        Test.create({name: "Decoded NUL markers cannot reference other literal tokens", test() {
            assertTokens('a["\\x001\\x00"]["\\x000\\x00"]["\\u{0}12\\u{0}"]',
                ["a", '["' + "\0" + "1" + "\0" + '"]',
                    '["' + "\0" + "0" + "\0" + '"]',
                    '["' + "\0" + "12" + "\0" + '"]']);
        }});

        Test.create({name: "Literal and bracket contents are never evaluated", test() {
            window.ObjectPathSplitSideEffect = () =>
                Assert.fail("Object path content was evaluated");
            try {
                assertTokens("a[ObjectPathSplitSideEffect]",
                    ["a", "[ObjectPathSplitSideEffect]"]);
                assertTokens('a["ObjectPathSplitSideEffect()"]',
                    ["a", '["ObjectPathSplitSideEffect()"]']);
                assertTokens("a[`${ObjectPathSplitSideEffect()}`]",
                    ["a", "[`${ObjectPathSplitSideEffect()}`]"]);
                assertInvalid("a[ObjectPathSplitSideEffect()]");
            } finally {
                delete window.ObjectPathSplitSideEffect;
            }
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
