<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-debug-testing.js"></script>
    <script>
      Test.activate();

      const model = Reactive({value: 1});
      const delay = () => new Promise(resolve => window.setTimeout(resolve, 0));
      Test.create({name: "Reactive bindings update for the first undefined assignment", async test() {
          const output = document.getElementById("value");
          Assert.assertEquals("1", output.textContent);

          model.value = undefined;
          await delay();
          Assert.assertEquals("", output.textContent);
      }});

      Test.start({auto: true});
    </script>
  </head>
  <body>
    <span id="value">{{model.value}}</span>
  </body>
</html>
