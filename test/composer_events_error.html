<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        Test.create({test() {
            Assert.assertTrue(Composer.EVENT_MODULE_LOAD === "composerModuleLoad");
            Assert.assertTrue(Composer.PATTERN_EVENT.test(Composer.EVENT_MODULE_LOAD));
        }});

        Test.create({test() {
            Assert.assertFalse(Composer.PATTERN_EVENT.test("TEST_EVENT"));
        }});

        // Errors in the listen/fire method must not prevent the following
        // events from being triggered.
        const collector = [];
        Composer.listen("composerTestEvent", () => {
            collector.push("composer-render-A");
            throw new Error("Expected composer error listener error");
        });
        Composer.listen("composerTestEvent", () => {
            collector.push("composer-render-B");
            (null).substring(1);
        });
        Composer.listen("composerTestEvent", () => {
            collector.push("composer-render-C");
            xxx.substring(1);
        });
        Composer.listen("composerTestEvent", () => {
            collector.push("composer-render-D");
            if (xxx = xxx) return 123;
        });
        Composer.listen("composerTestEvent", () => {
            collector.push("composer-render-E");
        });
        Test.create({test() {
            Composer.fire("composerTestEvent");
            console.debug(collector.join("\n"));
            Assert.assertSameTo("script[type='text/test']", collector.join("\n"));
        }});

        Test.start({auto:true});
    </script>
    <script type="text/test">
      composer-render-A
      composer-render-B
      composer-render-C
      composer-render-D
      composer-render-E
    </script>
  </head>
  <body>
  </body>
</html>
