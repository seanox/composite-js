<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        Test.create({test() {
            DataSource.collect();
        }});
        Test.create({expected:/\bInvalid xml locator: object/i, test() {
            DataSource.collect(null);
        }});
        Test.create({expected:/\bInvalid xml locator: object/i, test() {
            DataSource.collect({});
        }});

        Test.create({test() {
            const collection = DataSource.collect("xml://datasource_collect_a");
            Assert.assertEquals(1, collection.querySelectorAll("collection > test").length);
            Assert.assertEquals(1, collection.querySelectorAll("collection > test[id='collect_a']").length);
        }});
        Test.create({test() {
            const collection = DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_a");
            Assert.assertEquals(2, collection.querySelectorAll("collection > test").length);
            Assert.assertEquals(2, collection.querySelectorAll("collection > test[id='collect_a']").length);
        }});
        Test.create({test() {
            const collection = DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_a", "xml://datasource_collect_b");
            Assert.assertEquals(3, collection.querySelectorAll("collection > test").length);
            Assert.assertEquals(2, collection.querySelectorAll("collection > test[id='collect_a']").length);
            Assert.assertEquals(1, collection.querySelectorAll("collection > test[id='collect_b']").length);
        }});
        Test.create({test() {
            const collection = DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_b", "xml://datasource_collect_c");
            Assert.assertEquals(3, collection.querySelectorAll("collection > test").length);
            Assert.assertEquals(1, collection.querySelectorAll("collection > test[id='collect_a']").length);
            Assert.assertEquals(1, collection.querySelectorAll("collection > test[id='collect_b']").length);
            Assert.assertEquals(1, collection.querySelectorAll("collection > test[id='collect_c']").length);
        }});
        Test.create({test() {
            const collection = DataSource.collect("xxx", "xml://datasource_collect_a", "xml://datasource_collect_b", "xml://datasource_collect_c");
            Assert.assertEquals(3, collection.querySelectorAll("xxx > test").length);
            Assert.assertEquals(1, collection.querySelectorAll("xxx > test[id='collect_a']").length);
            Assert.assertEquals(1, collection.querySelectorAll("xxx > test[id='collect_b']").length);
            Assert.assertEquals(1, collection.querySelectorAll("xxx > test[id='collect_c']").length);
        }});
        Test.create({test() {
            const collection = DataSource.collect("xxx", "xml://datasource_collect_a?//*/@test");
            const evaluator = new XPathEvaluator();
            let result;
            result = evaluator.evaluate("count(/xxx/attribute[@test])=3", collection);
            Assert.assertTrue(result.booleanValue);
            result = evaluator.evaluate("boolean(/xxx/attribute[@test='aa'])", collection);
            Assert.assertTrue(result.booleanValue);
            result = evaluator.evaluate("boolean(/xxx/attribute[@test='bb'])", collection);
            Assert.assertTrue(result.booleanValue);
            result = evaluator.evaluate("boolean(/xxx/attribute[@test='cc'])", collection);
            Assert.assertTrue(result.booleanValue);
        }});

        Test.create({test() {
            const collection = DataSource.collect("xxx", "xml://datasource_collect_a?count(//*/attribute/@test)");
            const evaluator = new XPathEvaluator();
            let result;
            result = evaluator.evaluate("boolean(/xxx/text[text()='0'])", collection);
            Assert.assertTrue(result.booleanValue);
        }});

        Test.create({expected:/\b404/i, test() {
            DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_b", "xml://datasource_collect_d");
        }});
        Test.create({expected:/\bInvalid xml locator: object/i, test() {
            DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_b", null);
        }});
        Test.create({expected:/\bInvalid xml locator: object/i, test() {
            DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_b", {});
        }});

        Test.create({name:"Review #31: collect distinguishes colliding collector names", test() {
            const locator = "xml://datasource_collect_a";
            Assert.assertEquals("Aa".hashCode(), "BB".hashCode());
            Assert.assertEquals("Aa", DataSource.collect("Aa", locator).documentElement.nodeName);
            Assert.assertEquals("BB", DataSource.collect("BB", locator).documentElement.nodeName);
        }});

        Test.create({name:"Review #31: collect preserves colliding inputs and their order", test() {
            const first = "xml:/data/xx/datasource_hash_Aa.xml";
            const second = "xml:/data/xx/datasource_hash_BB.xml";
            Assert.assertEquals(first.hashCode(), second.hashCode());
            const ids = collection => Array.from(collection.documentElement.children)
                .map(node => node.getAttribute("id")).join(",");
            Assert.assertEquals("Aa", ids(DataSource.collect(first)));
            Assert.assertEquals("BB", ids(DataSource.collect(second)));
            Assert.assertEquals("Aa,BB", ids(DataSource.collect(first, second)));
            Assert.assertEquals("BB,Aa", ids(DataSource.collect(second, first)));
            Assert.assertEquals("Aa,Aa", ids(DataSource.collect(first, first)));
        }});

        Test.create({name:"Review #31: collect includes XPath in its cache identity", test() {
            const locator = "xml:/data/xx/datasource_hash_Aa.xml";
            Assert.assertEquals("Aa", DataSource.collect(locator + "?string(/test/@id)").documentElement.textContent);
            Assert.assertEquals("1", DataSource.collect(locator + "?count(/test)").documentElement.textContent);
            Assert.assertEquals("a,bc", DataSource.collect(locator + '?concat("a,b", "c")').documentElement.textContent);
            Assert.assertEquals("ab,c", DataSource.collect(locator + '?concat("a", "b,c")').documentElement.textContent);
        }});

        Test.create({name:"Review #31: collect reuses normalized inputs and returns independent clones", test() {
            const fetch = DataSource.fetch;
            let calls = 0;
            DataSource.fetch = locator => {
                calls++;
                return fetch.call(DataSource, locator);
            };
            try {
                const first = DataSource.collect("cache", "xml:/data/xx/./datasource_hash_Aa.xml");
                first.documentElement.setAttribute("changed", "yes");
                first.documentElement.firstChild.setAttribute("id", "changed");
                const repeated = DataSource.collect("cache", "xml://data//xx/datasource_hash_Aa.xml");
                Assert.assertEquals(1, calls);
                Assert.assertNotEquals(first, repeated);
                Assert.assertFalse(repeated.documentElement.hasAttribute("changed"));
                Assert.assertEquals("Aa", repeated.documentElement.firstChild.getAttribute("id"));
            } finally {
                DataSource.fetch = fetch;
            }
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
