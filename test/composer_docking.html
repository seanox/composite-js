    <script type="text/javascript">
    
        Test.activate();

        const stack = ["Step:0"];

        const modelA = {
            status: true,
            dock() {
                stack.push("A:dock");
            },
            undock() {
                stack.push("A:undock");
            },
            button: {
                onClick() {
                    stack.push("A:onClick");
                    modelA.status = !modelA.status;
                }
            }
        };

        const modelB = {
            status: true,
            undock() {
                stack.push("B:undock");
            },
            button: {
                onClick() {
                    stack.push("B:onClick");
                    modelB.status = !modelB.status;
                }
            }
        };

        const modelC = {
            status: true,
            dock() {
                stack.push("C:dock");
            },
            button: {
                onClick() {
                    stack.push("C:onClick");
                    modelC.status = !modelC.status;
                }
            }
        };

        const modelD = {
            status: true,
            button: {
                onClick() {
                    stack.push("D:onClick");
                    modelD.status = !modelD.status;
                }
            }
        };

        const page = {

            //Test with the assignment via the qualifier.    
            buttonA: {
                modelA: {
                    onClick(event) {
                        modelA.button.onClick.call(event);
                    }
                },
                modelB: {
                    onClick(event) {
                        modelB.button.onClick.call(event);
                    }
                },
                modelC: {
                    onClick(event) {
                        modelC.button.onClick.call(event);
                    }
                },
                modelD: {
                    onClick(event) {
                        modelD.button.onClick.call(event);
                    }
                }
            },
            
            //Test with indirect/secondary assignment via the qualifier.
            buttonB: {
                onClick(event) {
                    let target = String(event.target.id.match(/[^:]+$/));
                    if (target)
                        target = Object.lookup(target + ":button:onClick");
                    if (target)
                        target.call(event);
                }
            },
            
            //Test with the assignment via the qualifier as index for an array.
            //The array is a set of anonymous object (references).
            buttonC: [
                modelA.button,
                modelB.button,
                modelC.button,
                modelD.button
            ],
            
            //Test similar to ModelA but with direct use of references.
            buttonDA: modelA.button,
            buttonDB: modelB.button,
            buttonDC: modelC.button,
            buttonDD: modelD.button,
        };

        Test.create({test() {
            Assert.assertSameTo("script[type='text/test-docking']", stack.join("\n"));
        }});

        Test.create({test() {
            //capture.validate();
        }});
        
        let step = 0;
        const capture = new Capture();
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            capture.snap();

            ++step;
            stack.push("Step:" + step);
            switch (step) {
                case 1:
                case 2:
                case 3:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonA\\:modelA").click();
                    });
                    return;
                case 4:
                case 5:
                case 6:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonA\\:modelB").click();
                    });
                    return;
                case 7:
                case 8:
                case 9:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonA\\:modelC").click();
                    });
                    return;
                case 10:
                case 11:
                case 12:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonA\\:modelD").click();
                    });
                    return;
                case 13: 
                case 14: 
                case 15:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonA\\:modelX").click();
                    });
                    return;
                    
                //----    
                case 16:
                    Composer.asynchronous(() => {
                        modelA.status = true;
                        modelB.status = true;
                        modelC.status = true;
                        modelD.status = true;
                        Composer.render(document.body);
                    });
                    return;
                case 17:
                case 18:
                case 19:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonB\\:modelA").click();
                    });
                    return;
                case 20:
                case 21:
                case 22:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonB\\:modelB").click();
                    });
                    return;
                case 23:
                case 24:
                case 25:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonB\\:modelC").click();
                    });
                    return;
                case 26:
                case 27: 
                case 28: 
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonB\\:modelD").click();
                    });
                    return;
                case 29:
                case 30:
                case 31:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonB\\:modelX").click();
                    });
                    return;
                    
                //----    
                case 32:
                    Composer.asynchronous(() => {
                        modelA.status = true;
                        modelB.status = true;
                        modelC.status = true;
                        modelD.status = true;
                        Composer.render(document.body);
                    });
                    return;
                case 33:
                case 34:
                case 35:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonC\\:0").click();
                    });
                    return;
                case 36:
                case 37:
                case 38:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonC\\:1").click();
                    });
                    return;
                case 39:
                case 40:
                case 41:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonC\\:2").click();
                    });
                    return;
                case 42:
                case 43: 
                case 44: 
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonC\\:3").click();
                    });
                    return;
                case 45:
                case 46:
                case 47:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonC\\:4").click();
                    });
                    return;
                
                //----    
                case 48:
                    Composer.asynchronous(() => {
                        modelA.status = true;
                        modelB.status = true;
                        modelC.status = true;
                        modelD.status = true;
                        Composer.render(document.body);
                    });
                    return;
                case 49:
                case 50:
                case 51:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonDA").click();
                    });
                    return;
                case 52:
                case 53:
                case 54:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonDB").click();
                    });
                    return;
                case 55:
                case 56:
                case 57:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonDC").click();
                    });
                    return;
                case 58:
                case 59: 
                case 60: 
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonDD").click();
                    });
                    return;
                case 61:
                case 62:
                case 63:
                    Composer.asynchronous(() => {
                        document.querySelector("#buttonDX").click();
                    });
                    return;
                case 64:
                    Test.start();
                    return;
            }
        });
    </script>
