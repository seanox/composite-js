<!DOCTYPE html>
<html>
  <head>
    <title>Seanox composite-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        let source;
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            source = Test.read("scripting_parse_benchmark.js");
            Test.create({test() {
                document.body.innerText += "Start 2500 runs\n";
                const timing = Date.now();
                for (let count = 0; count < 2500; count++) {
                    try {Scripting.eval(source);
                    } catch (error) {
                        Assert.fail(error.message);
                    }
                }
                document.body.innerText += "Timing " + (Date.now() -timing) + "\n";
                console.log(`Benchmark: ${Date.now() -timing} ms`);
            }});
            Test.start();
        });
    </script>
  </head>
  <body>
  </body>
</html>
