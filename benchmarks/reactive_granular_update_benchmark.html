<!DOCTYPE HTML>
<html>
  <head>
    <title>Seanox aspect-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="aspect-js.js"></script>
    <script type="text/javascript">

        Test.activate();

        const state = {
            nodes: Array.from({length: 10000}, (_, i) => ({value: i}))
        }.reactive();
        const result = {duration: ""}.reactive();

        let phase = 0;
        let timing;

        Composite.listen(Composite.EVENT_RENDER_END, () => {
            phase++;
            if (phase === 1) {
                timing = performance.now();
                state.nodes[5000].value++;
            } else if (phase === 2) {
                const elapsed = performance.now() -timing;
                result.duration = `Duration ${elapsed.toFixed(0)} ms`;
                Test.create({test() {
                    const message = `${elapsed.toFixed(0)}`;
                    console.log(`Benchmark: ${message} ms`);
                }});
                Test.start();
            }
        });
    </script>
  </head>
  <body>
    Info: Output is hidden
    <div iterate="{{node:state.nodes}}" style="display:none;">{{node.item.value}}</div>
    <p id="duration">{{result.duration}}</p>
  </body>
</html>
