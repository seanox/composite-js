<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
      }
      body div {
        margin: 1em;
      }
      input[type="text"] {
        width: 2em;
      }
      input[type="button"] {
        width: 3em;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        // The variable expression {{countRender:...}} persists countRender in
        // the view scope, not in the global (window) scope. The test script
        // therefore cannot access the view scope directly and uses a fixed
        // number of iterations for deterministic output. Each iteration
        // triggers rendering twice (OnClick method and render attribute), so
        // 4 iterations plus the initial rendering result in Render:9. In the
        // markup, the first access to countRender is tolerated because the
        // variable does not exist in the view scope before the first rendering.

        let countClick = 0
        const about = {
            contact: {
                onClick() {
                    countClick++;
                }    
            },
            refresh: {
                onClick() {
                    Composer.render(document.body);
                }    
            }
        };
        
        Test.create({test() {
            for (let loop = 0; loop < 4; loop++) {
                document.querySelector("#contact").click();
                document.querySelector("#refresh").click();
            }
            const result = document.body.textContent.replace(/\s+/g, " ").trim();
            Assert.assertEquals("Render:9, Click:4 refresh contact", result);
        }});
        
        Test.start({auto:true});
    </script>
  </head>
  <body>
    <!--
      The rendering is indirectly triggered twice with the Refresh button.
      First in the OnClick.method, then indirectly via the render attribute.
      Due to an error in the mount method, the contact button was not mounted
      correctly on the second pass.  error has been fixed, the test remains,
      that it is difficult to adjust and would be annoying if the error is not
      noticed later.
    -->
    {{countRender:((? countRender) ?? 0) +1}}
    Render:{{countRender}}, Click:{{countClick}}
    <div id="about" composite condition="{{true}}">
      <button id="refresh" events="click" render="body">refresh</button>
      <div iterate="{{iterate:[1]}}">
        <button id="contact">contact</button>
      </div>
    </div>
  </body>
</html>
