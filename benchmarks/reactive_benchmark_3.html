<!DOCTYPE HTML>
<html>
  <head>
    <title>Seanox aspect-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="aspect-js.js"></script>
    <script type="text/javascript">

       Test.activate();

       const model = {value: 0}.reactive();
       const result = {duration: ""}.reactive();
      
       let initialRenderDone = false;
       let finished = false;
       let timing;
       let renderCount = 0;
       let checkTask;
       let lastRender;
      
       Composite.listen(Composite.EVENT_RENDER_END, () => {

           if (finished)
               return;
      
           lastRender = performance.now();
      
           if (!initialRenderDone) {
               initialRenderDone = true;
               timing = performance.now();
               renderCount = 0;
               for (let i = 0; i < 1000; i++)
                   model.value = i;
               return;
           }
      
           renderCount++;
           if (checkTask)
               checkTask.cancel();
           
           checkTask = Composite.asynchronous(() => {
               finished = true;
               const elapsed = lastRender - timing;
               let timeout;
               if (navigator.engine === "blink")
                   timeout = 5;
               if (navigator.engine === "webkit")
                   timeout = 10;
               if (navigator.engine === "goanna")
                   timeout = 50;
               if (navigator.engine === "gecko")
                   timeout = 5;
               result.duration = `Duration ${elapsed.toFixed(2)} ms`;
               Test.create({test() {
                   const message = `${elapsed.toFixed(2)} ms (expected max. ${timeout} ms)`;
                   console.log(`Benchmark Batching: ${elapsed.toFixed(2)}ms, ${renderCount} render cycle(s)`);                   
                   console.log(`Benchmark Batching: ${message}`);
                   Assert.assertTrue(`Duration ${message}`, elapsed < timeout);
               }});
               Test.start();
           });
       });    
    </script>
  </head>
  <body>
    <p id="target">{{model.value}}</p>
    <p id="duration">{{result.duration}}</p>
  </body>
</html>
