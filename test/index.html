<!DOCTYPE html>
<html>
  <head>
    <title>Seanox composite-js Test Environment</title>
    <style>
      :root {
        --border:  #ffffff;
        --header:  #f0f0f0;
        --gray:    #c0c0c0;
        --line:    #909090;

        --info:    #00a0f0;
        --success: #70a040;
        --error:   #ff0000;
        --warn:    #ffa000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: monospace;
        overflow: hidden;
        display: grid;
        grid-template-rows: 3em 1fr;
        grid-template-columns: 20% 40% 40%;
        height: 100vh;
      }

      header {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: inherit;
        background: var(--header);
        border-bottom: 3px solid var(--border);
        align-items: center;
        padding-left: .5em;
      }
      header > div {
        font-weight: bold;
      }

      main {
        display: contents;
      }

      #progress,
      #output,
      #frame {
        overflow: auto;
        position: relative;
      }

      #frame iframe {
        position: absolute;
        inset: 0;
        border: 0;
        width: 100%;
        height: 100%;
      }

      #progress > div {
        padding: 0.75em;
        border-left: 0.5em solid var(--gray);
        cursor: pointer;
      }
      #progress > div + div {
        border-top: 1px dotted var(--line);
        margin-top: 1px;
      }
      #progress > div.progress {
        border-left-color: var(--info);
      }
      #progress > div.successful {
        border-left-color: var(--success);
      }
      #progress > div.failed {
        border-left-color: var(--error);
      }
      #progress > div span ~ span {
        color: var(--gray);
      }
      #progress > div.failed span ~ span {
        color: var(--error);
      }

      #output pre {
        margin: 0;
        padding: 0.75em;
        border-left: 0.5em solid var(--gray);
      }
      #output pre + pre {
        border-top: 1px dotted var(--line);
        margin-top: 1px;
      }
      #output pre.info {
        border-left-color: var(--info);
      }
      #output pre.warn {
        border-left-color: var(--warn);
      }
      #output pre.error {
        border-left-color: var(--error);
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
      (() => {
          "use strict";

          let progressElement;
          let outputElement;
          let iframeElement;

          let queue;
          let faults;

          const benchmarks = [];

          const attachProgress = () => {
              const fragment = document.createDocumentFragment();
              queue = document.querySelector("script[type='text/test-cases']");
              queue = queue.textContent.trim().split(/\s+/);
              queue = queue.filter(entry => !entry.match(/^\*/));
              queue.forEach(entry => {
                  const id = entry.hashCode();
                  const item = document.createElement("div");
                  item.id = id;
                  item.dataset.test = entry;
                  item.innerHTML = `${entry}<br><meter></meter> <span>-</span>/<span>-</span>`;
                  fragment.appendChild(item);
              });
              progressElement.appendChild(fragment);
              progressElement.addEventListener("click", (event) => {
                  const target = event.target.closest('#progress > div');
                  if (!target)
                      return;
                  const targetName = target.dataset.test;
                  if (event.ctrlKey
                          || event.shiftKey) {
                    const targetUrl = location.href.replace(/([^\/]+$)|$/, targetName);
                    const targetWindow = window.open(targetUrl, '_extern_test');
                      if (targetWindow)
                          targetWindow.focus();
                      return;
                  }
                  faults = false;
                  outputElement.innerHTML = '';
                  loadTest(targetName);
              });
          };

          const attachTestListeners = () => {

              Test.activate();

              Test.listen(Test.EVENT_START, (event, status) => {
                  outputMessage("info",
                          `Start of ${locateTest()}\r\n\t${status.queue.size} tests found`);
              });

              Test.listen(Test.EVENT_PERFORM, (event, status) => {
                  performTest(event, status);
              });

              Test.listen(Test.EVENT_FINISH, (event, status) => {

                  performTest(event, status);
                  if (queue.length <= 0) {
                    if (faults)
                        outputMessage("error", "Some of the tests failed.");
                    else outputMessage("info", "All tests were successful.");
                    if (benchmarks.length)
                        outputMessage("info", "Benchmark summary\r\n\t"
                                + benchmarks.map(value => value.padStart(7)).join("\r\n\t"));
                  } else loadTest(queue.shift());

                  window.focus();
                  document.body.focus();

                  let test = locateTest();
                  test = document.querySelector("#" + test.hashCode());
                  if (test && !test.className) {
                      test.scrollIntoView(false);
                      test.className = "progress";
                  }
              });

              Test.listen(Test.EVENT_INTERRUPT, (event, status) => {
                  outputMessage("warn", "Interrupt of " + locateTest());
                  performTest(event, status);
                  if (queue.length > 0)
                      loadTest(queue.shift());
              });

              console.listen((event, ...variants) => {
                  if (event == null)
                      return;
                  let message = variants.join(", ");
                  event = (event || "").trim();
                  if (event.match(/^error$/i))
                      if (!String(message).match(/^[a-z]+,[\w\s]+\d{4}\s\d{2}:\d{2}:\d{2}\s[a-z]+\s+Test/i))
                          event = "warn";
                  message = message.replace(/^[a-z]+,[\w\s]+\d{4}\s\d{2}:\d{2}:\d{2}\s[a-z]+\s+/i, "");
                  outputMessage(event, message);

                  const match = message.match(/Benchmark(?:\s+\d+)?:\s*(\d+)\s*(ms)/i);
                  if (match)
                      benchmarks.push(match[1] + " " + match[2]);
              });
          };

          window.addEventListener("load", () => {
              progressElement = document.querySelector("#progress");
              outputElement = document.querySelector("#output");
              iframeElement = document.querySelector("#frame iframe");
              attachProgress();
              attachTestListeners();
              loadTest(queue.shift());
          });

          const locateTest = () => {
              return String(iframeElement.getAttribute("src").match(/^[^\?]+/));
          };

          const loadTest = (test) => {
              outputMessage("info", "Loading " + test);
              iframeElement.setAttribute("src", test || queue.shift() + "?" + Date.now());
          };

          const performTest = (event, status) => {
              let test = locateTest();
              test = document.querySelector("#" + test.hashCode());
              test.scrollIntoView(false);

              const meter = test.querySelector("meter");
              meter.max = status.queue.size;
              meter.value = status.queue.progress;
              test.querySelector("span").textContent = status.queue.progress;
              test.querySelector("span + span").textContent = status.queue.faults;
              test.className = status.queue.faults ? "failed" : "successful";
              if (status.queue.faults)
                  faults = true;
          };

          const outputMessage = (level, message) => {
              if (!message)
                  return;
              const output = document.createElement("pre");
              output.className = level;
              output.textContent = String(message).trim();
              outputElement.appendChild(output);
              outputElement.scrollTop = outputElement.scrollHeight;
          };
      })();
    </script>
