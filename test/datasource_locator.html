<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        Test.create({expected:/\bUnsupported schema: raw:\/item/i, test() {
            DataSource.fetch("raw:/item");
        }});
        Test.create({expected:/\bUnsupported schema: json:\/item/i, test() {
            DataSource.fetch("json:/item");
        }});

        ["xml", "xml:", "xml:/", "xml://", "xml:///", "xslt:/"].forEach(locator =>
            Test.create({name:"fetch rejects invalid locator " + locator,
                expected:/\bInvalid locator:/i, test() {
                    DataSource.fetch(locator);
                }}));

        ["xml", "xslt"].forEach(schema =>
            Test.create({name:"fetch reports missing " + schema + " resources",
                expected:new RegExp("\\bHTTP status 404 for .*\\/data\\/xx\\/b-b\\." + schema, "i"),
                test() {
                    DataSource.fetch(schema + ":/b-b");
                }}));

        Test.create({name:"fetch resolves contextual, explicit and normalized XML locators", test() {
            [
                ["xml:/datasource_collect_a", "test", "collect_a"],
                ["xml:/b-b/locator_b", "data", null],
                ["xml://data/xx/datasource_collect_b.xml?", "test", "collect_b"],
                ["xml://data//xx/b-b/../datasource_collect_c.xml", "test", "collect_c"]
            ].forEach(([locator, root, id]) => {
                const data = DataSource.fetch(locator);
                Assert.assertTrue(data instanceof XMLDocument);
                Assert.assertEquals(root, data.documentElement.nodeName);
                Assert.assertEquals(id, data.documentElement.getAttribute("id"));
            });
        }});

        Test.create({name:"fetch returns XPath nodes, scalar values and null", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            Assert.assertEquals(1, DataSource.fetch(locator + "?count(/test/title)"));
            Assert.assertEquals(true, DataSource.fetch(locator + "?boolean(/test/title)"));
            Assert.assertEquals("Collect A", DataSource.fetch(locator + "?string(/test/title)"));
            Assert.assertEquals(null, DataSource.fetch(locator + "?/test/missing"));
            const nodes = DataSource.fetch(locator + "?/test/title");
            Assert.assertTrue(nodes instanceof NodeList);
            Assert.assertEquals(1, nodes.length);
            Assert.assertEquals("title", nodes[0].nodeName);
            Assert.assertEquals("Collect A", nodes[0].textContent);
            const text = DataSource.fetch(locator + "?/test/title/text()");
            Assert.assertEquals(1, text.length);
            Assert.assertEquals("text", text[0].nodeName);
            Assert.assertEquals("Collect A", text[0].textContent);
        }});

        Test.create({name:"Review #33: fetch accepts XPath selecting the document node", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            const root = DataSource.fetch(locator).documentElement;
            const result = DataSource.fetch(locator + "?/");
            Assert.assertTrue(result instanceof NodeList);
            Assert.assertEquals(1, result.length);
            Assert.assertTrue(root.isEqualNode(result[0]));
        }});

        Test.create({name:"Review #33: fetch preserves document and element results separately", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            const root = DataSource.fetch(locator).documentElement;
            const result = DataSource.fetch(locator + "?/ | /*");
            Assert.assertTrue(result instanceof NodeList);
            Assert.assertEquals(2, result.length);
            Assert.assertTrue(root.isEqualNode(result[0]));
            Assert.assertTrue(root.isEqualNode(result[1]));
            Assert.assertNotEquals(result[0], result[1]);
            result[0].setAttribute("id", "changed");
            Assert.assertEquals("collect_a", result[1].getAttribute("id"));
        }});

        Test.create({name:"Review #33: transform receives the document element", test() {
            const style = new DOMParser().parseFromString(
                '<xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">'
                + '<xsl:output method="xml"/><xsl:template match="/">'
                + '<result><xsl:value-of select="/data/test/title"/></result>'
                + '</xsl:template></xsl:stylesheet>', "text/xml");
            const result = DataSource.transform("xml:/data/xx/datasource_collect_a.xml?/", style);
            Assert.assertTrue(result instanceof DocumentFragment);
            Assert.assertEquals("Collect A", result.textContent);
        }});

        Test.create({name:"Repeated fetches make new XHR calls and return independent documents", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            const address = new URL(window.location.contextPath
                + "/data/xx/datasource_collect_a.xml", window.location.href).href;
            let calls = 0;
            const listener = event => {
                const meta = event[Composer.EVENT_HTTP_LOAD];
                if (meta.type === "XMLHttpRequest" && meta.url === address)
                    calls++;
            };
            window.addEventListener(Composer.EVENT_HTTP_LOAD, listener);
            try {
                const first = DataSource.fetch(locator);
                first.documentElement.setAttribute("id", "changed");
                const repeated = DataSource.fetch(locator);
                Assert.assertNotEquals(first, repeated);
                Assert.assertEquals("collect_a", repeated.documentElement.getAttribute("id"));
                Assert.assertEquals(2, calls);
            } finally {
                window.removeEventListener(Composer.EVENT_HTTP_LOAD, listener);
            }
        }});

        Test.create({name:"Review #43: invalid XML reports the resource URL",
            expected:/\bInvalid XML for .*\/data\/xx\/datasource_invalid\.xml\b/i, test() {
                DataSource.fetch("xml:/data/xx/datasource_invalid.xml");
            }});

        ["?", "?//*"].forEach(query =>
            Test.create({name:"fetch rejects XSLT query " + query,
                expected:/\bInvalid xslt locator:/i, test() {
                    DataSource.fetch("xslt:/data/xx/locator_a.xslt" + query);
                }}));

        Test.create({name:"fetch resolves contextual and explicit XSLT locators", test() {
            ["xslt:/locator_a", "xslt://data/xx/b-b/locator_b.xslt"].forEach(locator => {
                const data = DataSource.fetch(locator);
                Assert.assertTrue(data instanceof XMLDocument);
                Assert.assertEquals("data", data.documentElement.nodeName);
            });
        }});

        Test.create({name:"fetch uses the scheme independently of the explicit file extension", test() {
            ["xml:/data/xx/b-b/locator_b.xslt",
                "xslt:/data/xx/b-b/locator_b.xml"].forEach(locator =>
                Assert.assertTrue(DataSource.fetch(locator) instanceof XMLDocument));
        }});

        Test.create({name:"fetch preserves percent literals in XPath queries", test() {
            const locator = Locator.parse(
                'xml:/data/xx/locator_a.xml?contains(., "100%25")');
            Assert.assertEquals(false, DataSource.fetch(locator.uri));
        }});

        Test.create({name:"fetch preserves percent literals in resource paths", test() {
            Assert.assertEquals("percent literal", DataSource.fetch(
                "xml:/data/xx/locator%25literal.xml?string(/data)"));
        }});

        Test.create({name:"fetch rejects external origins before opening a request", test() {
            const source = "xml:/external.xml";
            const parse = Locator.parse;
            const open = XMLHttpRequest.prototype.open;
            let requests = 0;
            Locator.parse = () => ({
                schema: Locator.SCHEMA_XML,
                path: "/external.xml",
                uri: "xml:https://example.invalid/outside.xml",
                query: undefined
            });
            XMLHttpRequest.prototype.open = () => {
                requests++;
                throw new Error("Unexpected request");
            };
            try {
                let error;
                try {DataSource.fetch(source);
                } catch (exception) {
                    error = exception;
                }
                Assert.assertTrue(error instanceof Error);
                Assert.assertTrue(error.message.includes(source));
                Assert.assertEquals(0, requests);
            } finally {
                Locator.parse = parse;
                XMLHttpRequest.prototype.open = open;
            }
        }});

        Test.create({name:"fetch enforces the application context in a nested page", timeout:10000, async test() {
            const frame = document.createElement("iframe");
            document.body.appendChild(frame);
            try {
                await new Promise(resolve => {
                    frame.addEventListener("load", resolve, {once:true});
                    frame.src = "/example/datasource_context.html";
                });
                const probe = frame.contentWindow.__contextProbe;
                Assert.assertNotNull(probe);
                Assert.assertEquals("/example", probe.contextPath);
                Assert.assertEquals("inside application context", probe.resource);
                Assert.assertTrue(probe.traversalError.includes(
                    "xml:/attempted-traversal.xml"));
                Assert.assertTrue(probe.prefixError.includes(
                    "xml:/attempted-prefix.xml"));
                const paths = probe.requests.map(entry =>
                    new URL(entry.response || entry.request,
                        frame.contentWindow.location.href).pathname);
                Assert.assertTrue(paths.every(path =>
                    path === "/example" || path.startsWith("/example/")));
            } finally {
                frame.remove();
            }
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
