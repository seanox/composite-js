<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        let label = "first";
        let initialLabel;
        let imageSource;
        let directiveVisible = true;
        let size = 10;
        let started = false;
        const errors = [];
        const literalAssignments = [];
        const image = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        const beforeRender = {};

        Composer.listen(Composer.EVENT_ERROR, (event, error) =>
            errors.push(error));

        Composer.customize(element => {
            if (element instanceof Element && element.id === "literal")
                Object.defineProperty(element, "data-label", {
                    set(value) {literalAssignments.push(value);}
                });
        });

        const render = element => new Promise(resolve => {
            Composer.listen(Composer.EVENT_RENDER_END, (event, selector) => {
                if (selector === element)
                    resolve();
            });
            Composer.render(element);
        });

        Test.create({name:"Defined directives synchronize attributes and properties", test() {
            const element = document.querySelector("#template");
            Assert.assertEquals("first", element.getAttribute("title"));
            Assert.assertEquals("first", element.title);
            Assert.assertEquals("first", element.getAttribute("data-label"));
            Assert.assertEquals("first", element["data-label"]);
            Assert.assertFalse(element.hasAttribute("[title]"));
            Assert.assertFalse(element.hasAttribute("[data-label]"));
            Assert.assertEquals(0, errors.length);
        }});

        Test.create({name:"Initially undefined directives are removed", test() {
            const element = document.querySelector("#initial");
            Assert.assertFalse(element.hasAttribute("[title]"));
            Assert.assertFalse(element.hasAttribute("[data-label]"));
            Assert.assertNull(element.getAttribute("title"));
            Assert.assertNull(element.getAttribute("data-label"));
            Assert.assertEquals("", element.title);
            Assert.assertUndefined(element["data-label"]);
        }});

        Test.create({name:"Initially undefined directives can acquire a value", timeout:3000, test() {
            const element = document.querySelector("#initial");
            initialLabel = "initial";
            return render(element).then(() => {
                Assert.assertEquals("initial", element.getAttribute("title"));
                Assert.assertEquals("initial", element.title);
                Assert.assertEquals("initial", element.getAttribute("data-label"));
                Assert.assertEquals("initial", element["data-label"]);
                Assert.assertFalse(element.hasAttribute("[title]"));
                Assert.assertFalse(element.hasAttribute("[data-label]"));
            });
        }});

        Test.create({name:"Undefined removes targets and restores fresh element property defaults", timeout:3000, test() {
            const element = document.querySelector("#template");
            label = undefined;
            return render(element).then(() => {
                Assert.assertNull(element.getAttribute("title"));
                Assert.assertEquals("", element.title);
                Assert.assertNull(element.getAttribute("data-label"));
                Assert.assertUndefined(element["data-label"]);
                Assert.assertFalse(element.hasOwnProperty("[title]"));
                Assert.assertFalse(element.hasOwnProperty("[data-label]"));
            });
        }});

        Test.create({name:"Removed targets are restored on a later render", timeout:3000, test() {
            const element = document.querySelector("#template");
            label = "second";
            return render(element).then(() => {
                Assert.assertEquals("second", element.getAttribute("title"));
                Assert.assertEquals("second", element.title);
                Assert.assertEquals("second", element.getAttribute("data-label"));
                Assert.assertEquals("second", element["data-label"]);
                Assert.assertFalse(element.hasAttribute("[title]"));
                Assert.assertFalse(element.hasAttribute("[data-label]"));
                Assert.assertEquals(0, errors.length);
            });
        }});

        ["sizeOrdinary", "sizeTemplate"].forEach(id => {
            Test.create({name:"Undefined restores the browser default for " + id, timeout:3000, test() {
                const element = document.getElementById(id);
                Assert.assertEquals("10", element.getAttribute("size"));
                Assert.assertEquals(10, element.size);
                Assert.assertEquals(0, errors.length);
                size = undefined;
                return render(element).then(() => {
                    Assert.assertEquals(0, errors.length);
                    Assert.assertNull(element.getAttribute("size"));
                    Assert.assertEquals(20, element.size);
                    Assert.assertFalse(element.hasAttribute("[size]"));
                });
            }});
        });

        Test.create({name:"Directives delay native attribute processing until rendering", test() {
            Assert.assertNull(beforeRender.dynamicSource);
            Assert.assertNull(beforeRender.literalSource);
            Assert.assertTrue(beforeRender.dynamicDirective);
            Assert.assertTrue(beforeRender.literalDirective);
            Assert.assertFalse(beforeRender.disabled);
            Assert.assertEquals("", beforeRender.literalCurrentSource);
            const element = document.getElementById("dynamicImage");
            Assert.assertNull(element.getAttribute("src"));
            Assert.assertFalse(element.hasAttribute("[src]"));
        }});

        Test.create({name:"Literal and empty directives create native attributes without property writes", test() {
            const element = document.getElementById("literal");
            Assert.assertEquals("  literal  ", element.getAttribute("title"));
            Assert.assertEquals("fixed", element.getAttribute("data-label"));
            Assert.assertEquals("", element.getAttribute("data-empty"));
            Assert.assertEquals(0, literalAssignments.length);
            Assert.assertFalse(element.hasAttribute("[title]"));
            Assert.assertFalse(element.hasAttribute("[data-label]"));
            Assert.assertFalse(element.hasAttribute("[data-empty]"));
            const input = document.getElementById("disabledInput");
            Assert.assertTrue(input.hasAttribute("disabled"));
            Assert.assertTrue(input.disabled);
            Assert.assertFalse(input.hasAttribute("[disabled]"));
            Assert.assertEquals(image, document.getElementById("literalImage").getAttribute("src"));
            Assert.assertFalse(document.getElementById("literalImage").hasAttribute("[src]"));
            Assert.assertEquals(0, errors.length);
        }});

        Test.create({name:"Literal directives are consumed once rather than rebound on later renders", timeout:3000, test() {
            const element = document.getElementById("literal");
            element.setAttribute("title", "changed");
            return render(element).then(() => {
                Assert.assertEquals("changed", element.getAttribute("title"));
                Assert.assertEquals(0, literalAssignments.length);
                Assert.assertEquals(0, errors.length);
            });
        }});

        Test.create({name:"Directive names are lowercased and interpolation remains dynamic", timeout:3000, test() {
            const element = document.getElementById("mixed");
            Assert.assertEquals("before first after", element.getAttribute("data-mixed"));
            Assert.assertFalse(element.hasAttribute("[data-mixed]"));
            return render(element).then(() => {
                Assert.assertEquals("before second after", element.getAttribute("data-mixed"));
                Assert.assertFalse(element.hasOwnProperty("DATA-MIXED"));
                Assert.assertEquals("before second after", element["data-mixed"]);
            });
        }});

        Test.create({name:"Only fully bracketed names without whitespace or nested brackets are directives", test() {
            const element = document.getElementById("invalid");
            ["[title", "title]", "[]", "[[lang]]", "[tabindex[]]"].forEach(name => {
                Assert.assertEquals("literal", element.getAttribute(name));
            });
            Assert.assertEquals("literal", element.firstElementChild.getAttribute("[data-\u00a0probe]"));
            Assert.assertFalse(element.firstElementChild.hasAttribute("data-\u00a0probe"));
            ["title", "lang", "tabindex", "data-probe"].forEach(name => {
                Assert.assertFalse(element.hasAttribute(name));
            });
            Assert.assertEquals(0, errors.length);
        }});

        Test.create({name:"A delayed src can be set, removed and set again", timeout:3000, test() {
            const element = document.getElementById("dynamicImage");
            const load = () => new Promise((resolve, reject) => {
                element.onload = resolve;
                element.onerror = reject;
                imageSource = image;
                render(element);
            });
            return load().then(() => {
                Assert.assertEquals(image, element.getAttribute("src"));
                Assert.assertEquals(1, element.naturalWidth);
                Assert.assertFalse(element.hasAttribute("[src]"));
                imageSource = undefined;
                return render(element);
            }).then(() => {
                Assert.assertNull(element.getAttribute("src"));
                Assert.assertFalse(element.hasAttribute("[src]"));
                return load();
            }).then(() => {
                Assert.assertEquals(image, element.getAttribute("src"));
                Assert.assertEquals(1, element.naturalWidth);
                Assert.assertEquals(0, errors.length);
            });
        }});

        Test.create({name:"Inserted directives and conditional clones retain their lifecycle", timeout:3000, test() {
            const fixture = document.createElement("div");
            fixture.innerHTML = '<span condition="{{directiveVisible}}" [title]="{{label}}" [lang]="en"></span>';
            document.body.appendChild(fixture);
            return render(fixture).then(() => {
                const element = fixture.firstElementChild;
                Assert.assertEquals("second", element.getAttribute("title"));
                Assert.assertEquals("en", element.getAttribute("lang"));
                Assert.assertFalse(element.hasAttribute("[title]"));
                directiveVisible = false;
                return render(fixture);
            }).then(() => {
                Assert.assertNull(fixture.firstElementChild);
                directiveVisible = true;
                label = "third";
                return render(fixture);
            }).then(() => {
                Assert.assertEquals("third", fixture.firstElementChild.getAttribute("title"));
                Assert.assertEquals("en", fixture.firstElementChild.getAttribute("lang"));
                Assert.assertEquals(0, errors.length);
            }).then(() => fixture.remove());
        }});

        Test.create({name:"Iteration copies resolve their own attribute directives", timeout:3000, test() {
            const fixture = document.createElement("div");
            fixture.innerHTML = '<span iterate="{{directiveItem:[1, 2]}}">'
                + '<em [title]="{{directiveItem.item}}" [lang]="en"></em></span>';
            document.body.appendChild(fixture);
            return render(fixture).then(() => {
                const elements = fixture.querySelectorAll("em");
                Assert.assertEquals(2, elements.length);
                Array.from(elements).forEach((element, index) => {
                    Assert.assertEquals(String(index +1), element.getAttribute("title"));
                    Assert.assertEquals("en", element.getAttribute("lang"));
                    Assert.assertFalse(element.hasAttribute("[title]"));
                    Assert.assertFalse(element.hasAttribute("[lang]"));
                });
                Assert.assertEquals(0, errors.length);
            }).then(() => fixture.remove());
        }});

        Test.create({name:"Legacy @ templates are not compatibility aliases", timeout:3000, test() {
            const element = document.createElement("span");
            element.innerHTML = '<em @title="{{label}}"></em>';
            document.body.appendChild(element);
            const errorCount = errors.length;
            return render(element).then(() => {
                Assert.assertNull(element.firstElementChild.getAttribute("title"));
                Assert.assertEquals(errorCount +1, errors.length);
                Assert.assertEquals("InvalidCharacterError", errors[errorCount].name);
            }).then(() => element.remove());
        }});

        Composer.listen(Composer.EVENT_RENDER_END, (event, selector) => {
            if (started || selector !== document.body)
                return;
            started = true;
            Test.start();
        });
    </script>
  </head>
  <body>
    <span id="template" [title]="{{label}}" [data-label]="{{label}}"></span>
    <span id="initial" [title]="{{initialLabel}}" [data-label]="{{initialLabel}}"></span>
    <input id="sizeOrdinary" size="{{size}}">
    <input id="sizeTemplate" [size]="{{size}}">
    <span id="literal" [TITLE]="  literal  " [data-label]="fixed" [data-empty]=""></span>
    <input id="disabledInput" [disabled]>
    <span id="mixed" [DATA-MIXED]="before {{label}} after"></span>
    <span id="invalid" [title="literal" title]="literal" []="literal"
          [[lang]]="literal" [tabindex[]]="literal"></span>
    <img id="dynamicImage" [src]="{{imageSource}}">
    <img id="literalImage" [src]="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    <script>
        document.getElementById("invalid").innerHTML = '<span [data-\u00a0probe]="literal"></span>';
        beforeRender.dynamicSource = document.getElementById("dynamicImage").getAttribute("src");
        beforeRender.literalSource = document.getElementById("literalImage").getAttribute("src");
        beforeRender.dynamicDirective = document.getElementById("dynamicImage").hasAttribute("[src]");
        beforeRender.literalDirective = document.getElementById("literalImage").hasAttribute("[src]");
        beforeRender.disabled = document.getElementById("disabledInput").disabled;
        beforeRender.literalCurrentSource = document.getElementById("literalImage").currentSrc;
    </script>
  </body>
</html>
