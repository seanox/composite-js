name: "⬜ Playwright: Tests"

on:
  workflow_call:
    inputs:
      artifacts:
        required: true
        type: string

jobs:
  playwright:
    name: "Playwright: ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    env:
      HOME: /root

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            engine: blink
            port: 8001
          - browser: firefox
            engine: gecko
            port: 8002
          - browser: webkit
            engine: webkit
            port: 8003

    steps:
      - name: Checkout current source
        uses: actions/checkout@v7
      - name: Download application artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifacts }}
          path: release/
      - name: Copy application artifacts
        run: |
          cp release/composite-js-debug-testing.js test/
          cp release/composite-js-testing.js test/
      - name: Install npm dependencies
        working-directory: test/playwright
        run: npm install
      - name: Install Playwright browser
        working-directory: test/playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        working-directory: test/playwright
        run: node runner.js -p ${{ matrix.port }} -e ${{ matrix.engine }} -d ..
