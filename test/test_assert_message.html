<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const consoleArguments = ["value", Symbol("x"), null, undefined];
        const consoleCalls = [];
        console.listen((level, ...variants) => {
            consoleCalls.push({level, variants});
        });

        const assertMessageValue = (value) => {
            try {Assert.assertTrue(value, false);
            } catch (error) {
                const message = String(error);
                Assert.assertTrue(message, message.includes("Error: Assert.assertTrue failed"));
            }
        }

        const monitorErrors = [];
        const originalConsoleError = console.error;
        console.error = function(...variants) {
            monitorErrors.push(variants.map(value => String(value)).join(" "));
            return originalConsoleError.apply(console, variants);
        };
        Test.listen(Test.EVENT_FINISH, () => {
            console.error = originalConsoleError;
        });
        const captureMonitorError = message => {
            const index = monitorErrors.length;
            Test.fire(Test.EVENT_RESPONSE, {
                task: {
                    title: "#monitor",
                    timing: Date.now(),
                    error: {message}
                }
            });
            return monitorErrors[index];
        };

        Test.create({test() {
            console.output.clear();
            const start = consoleCalls.length;
            const levels = ["log", "warn", "error", "info"];
            levels.forEach(level => console[level](...consoleArguments));

            levels.forEach((level, index) => {
                Assert.assertEquals("value, Symbol(x), , ", console.output[level]);
                const call = consoleCalls[start + index];
                Assert.assertEquals(level, call.level);
                Assert.assertEquals(consoleArguments.length, call.variants.length);
                consoleArguments.forEach((value, index) =>
                    Assert.assertSame(value, call.variants[index]));
            });
            Assert.assertEquals(levels.length, consoleCalls.length - start);
        }});

        Test.create({test() {
            assertMessageValue(10);
            assertMessageValue({});
            assertMessageValue(null);
            assertMessageValue(undefined);
            assertMessageValue(true);
        }});

        Test.create({test() {
            const start = monitorErrors.length;
            const direct = captureMonitorError("BOOM");
            Assert.assertTrue(direct.endsWith(" BOOM"));
            Assert.assertFalse(direct.includes("function trim()"));

            const padded = captureMonitorError("  PADDED  ");
            Assert.assertTrue(padded.endsWith(" PADDED"));

            const blank = captureMonitorError("   ");
            Assert.assertTrue(blank.endsWith(" unknown error"));
            Assert.assertEquals(3, monitorErrors.length - start);
        }});

        Test.start({auto:true});
    </script>
  <head>
  <body>
  </body>
</html>
