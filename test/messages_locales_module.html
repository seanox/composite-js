<!DOCTYPE html>
<html>
  <head>
    <meta charset="ISO-8859-1">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
      }
      body div {
        margin: 1em;
      }
      body * {
        display: block;
      }
    </style>
    <script src="composite-js.js"></script>
    <script src="scripts/capture.js"></script>
    <script type="text/javascript">

        Test.activate();

        const capture = new Capture();
        Composite.listen(Composite.EVENT_RENDER_END, () => {
            capture.snap();
            const count = capture.patterns().length;
            if (capture.size() === count)
                Test.start();
            if (capture.size() > count)
                Assert.assertEquals("expected {1} steps but was {2}", count, capture.size());
        });

        Test.create({test() {
            capture.validate();
        }});
    </script>
    <script type="text/test">
      xxX
      false
      xxX
      oo_nsA_a_ns3
    </script>
  </head>
  <body>
    {{messages.xx}}
    {{(?messages.nsA.a.ns3.oo)}}
    <div id="ns3@nsA:a" composite></div>
    {{messages.xx}}
    {{(?messages.nsA.a.ns3.oo)}}
  </body>
</html>
