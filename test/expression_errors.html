<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script src="scripts/capture.js"></script>
    <script type="text/javascript"> 
    
        Test.activate();

        Test.create({test() {
            const content = document.body.textContent;
            console.debug(content);
            Assert.assertSameTo("script[type='text/test']", content);
            const outputs = document.querySelectorAll("body > span");
            Assert.assertEquals(14, outputs.length);
            for (const index of [0, 2, 5, 8, 11, 13])
                Assert.assertEquals("", outputs[index].textContent);
        }});

        Test.start({auto:true})

        const model = {
            throwError1: () => {
                throw "";
            },
            throwError2: () => {
                throw "Oops";
            },
            throwError3: () => {
                throw {code: 500};
            },
            throwError4: () => {
                throw null;
            },
            throwError5: () => {
                throw new Error("Oops");
            },
            throwError6: () => {
                throw undefined;
            }
        };
    </script>
    <script type="text/test">
      123
      [object Object]
      Oops
      false
      true

      Oops
      [object Object]
      Error: Oops
    </script>
  </head>
  <body>
    <span>{{throw ""}}</span>
    <span>{{throw 123}}</span>
    <span>{{throw null}}</span>
    <span>{{throw new Object()}}</span>
    <span>{{throw "Oops"}}</span>
    <span>{{throw undefined}}</span>
    <span>{{throw false}}</span>
    <span>{{throw true}}</span>

    <span>{{model.throwError1()}}</span>
    <span>{{model.throwError2()}}</span>
    <span>{{model.throwError3()}}</span>
    <span>{{model.throwError4()}}</span>
    <span>{{model.throwError5()}}</span>
    <span>{{model.throwError6()}}</span>
  </body>
</html>
