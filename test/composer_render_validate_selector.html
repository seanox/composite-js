<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script>

        Test.activate();

        window.ValidationSelectorModel = {
            field: "", other: "", required: "", result: true, calls: [], clicks: 0,
            validate(element, value) {
                if (element.id === "action")
                    return Composer.validate("#ValidationSelectorModel #field", false);
                this.calls.push({element, value, context:this});
                return this.result;
            },
            action: {
                onClick() {ValidationSelectorModel.clicks++;}
            }
        };
        const fieldSelector = "#ValidationSelectorModel #field";

        for (const selector of [
            "#ValidationSelectorModel .validation-field",
            "#ValidationSelectorModel #field, #ValidationSelectorModel #other"
        ])
            Test.create({name:"Reject ambiguous validation before changing any field: " + selector, test() {
                const fields = Array.from(document.querySelectorAll(selector));
                Assert.assertEquals(2, fields.length);
                fields.forEach((element, index) => element.setCustomValidity("Existing " + index));
                ValidationSelectorModel.calls.length = 0;
                let caught;
                let messages;
                try {Composer.validate(selector, false);
                } catch (error) {
                    caught = error;
                } finally {
                    messages = fields.map(element => element.validationMessage);
                    fields.forEach(element => element.setCustomValidity(""));
                }
                Assert.assertTrue(caught instanceof Error);
                Assert.assertEquals("Selector is not unique", caught.message);
                Assert.assertEquals(0, ValidationSelectorModel.calls.length);
                Assert.assertEquals("Existing 0,Existing 1", messages.join(","));
            }});

        for (const [name, result] of [
            ["success", true], ["failure", false], ["undefined", undefined],
            ["message", "  Invalid {{literal}}  "], ["empty message", ""],
            ["blank message", "  "], ["null", null], ["zero", 0],
            ["number", 1], ["object", {fault:true}]
        ])
            Test.create({name:"Preserve the element result and message for a unique selector: " + name, test() {
                const field = document.querySelector(fieldSelector);
                ValidationSelectorModel.result = result;
                ValidationSelectorModel.calls.length = 0;
                field.value = "Current input";
                Assert.assertEquals(result, Composer.validate(field, false));
                const message = field.validationMessage;
                const fault = field.fault;
                Assert.assertEquals(result, Composer.validate("  " + fieldSelector + "  ", false));
                Assert.assertEquals(message, field.validationMessage);
                Assert.assertEquals(fault, field.fault);
                Assert.assertEquals(2, ValidationSelectorModel.calls.length);
                for (const call of ValidationSelectorModel.calls) {
                    Assert.assertEquals(field, call.element);
                    Assert.assertEquals("Current input", call.value);
                    Assert.assertEquals(ValidationSelectorModel, call.context);
                }
                Assert.assertEquals("", ValidationSelectorModel.field);
            }});

        Test.create({name:"Forward the application validation lock for a unique selector", test() {
            const field = document.querySelector(fieldSelector);
            ValidationSelectorModel.result = "Application failure";
            ValidationSelectorModel.calls.length = 0;
            Assert.assertTrue(Composer.validate(fieldSelector));
            Assert.assertTrue(Composer.validate(fieldSelector, true));
            Assert.assertEquals(0, ValidationSelectorModel.calls.length);
            Assert.assertEquals("", field.validationMessage);
            Assert.assertEquals("Application failure", Composer.validate(fieldSelector, false));
            Assert.assertEquals(1, ValidationSelectorModel.calls.length);
            Assert.assertEquals("Application failure", field.validationMessage);
        }});

        Test.create({name:"Keep HTML5 validation ahead of application validation", test() {
            const selector = "#ValidationSelectorModel #required";
            const field = document.querySelector(selector);
            ValidationSelectorModel.result = true;
            ValidationSelectorModel.calls.length = 0;
            Assert.assertFalse(Composer.validate(selector, false));
            Assert.assertEquals(0, ValidationSelectorModel.calls.length);
            Assert.assertEquals("Required", field.validationMessage);
            try {
                field.value = "Provided";
                Assert.assertTrue(Composer.validate(selector, false));
                Assert.assertEquals(1, ValidationSelectorModel.calls.length);
                Assert.assertEquals("", field.validationMessage);
            } finally {
                field.value = "";
            }
        }});

        Test.create({name:"Keep missing and empty selectors without a validation result", test() {
            ValidationSelectorModel.calls.length = 0;
            for (const selector of ["#missingValidationField", "", "   "])
                Assert.assertUndefined(Composer.validate(selector, false));
            Assert.assertEquals(0, ValidationSelectorModel.calls.length);
        }});

        Test.create({name:"Propagate malformed CSS selectors before validation", test() {
            ValidationSelectorModel.calls.length = 0;
            let caught;
            try {Composer.validate("[", false);
            } catch (error) {
                caught = error;
            }
            Assert.assertNotNull(caught);
            Assert.assertEquals("SyntaxError", caught.name);
            Assert.assertEquals(0, ValidationSelectorModel.calls.length);
        }});

        Test.create({name:"Propagate the original application validation error for a unique selector", test() {
            const validate = ValidationSelectorModel.validate;
            const failure = new Error("Application validation failed");
            ValidationSelectorModel.validate = () => {throw failure;};
            let caught;
            try {Composer.validate(fieldSelector, false);
            } catch (error) {
                caught = error;
            } finally {
                ValidationSelectorModel.validate = validate;
            }
            Assert.assertEquals(failure, caught);
        }});

        Test.create({name:"Keep unrendered elements ignored for references and selectors", test() {
            const field = document.createElement("input");
            field.id = "unrenderedValidationField";
            document.body.appendChild(field);
            try {
                Assert.assertUndefined(Composer.validate(field, false));
                Assert.assertUndefined(Composer.validate("#unrenderedValidationField", false));
            } finally {
                field.remove();
            }
        }});

        for (const [result, expectedClick, expectedDefault] of [
            [true, 1, true], [undefined, 0, true], [false, 0, false],
            ["Invalid input", 0, false]
        ])
            Test.create({name:"Keep event behavior when application validation delegates to a unique selector: " + result, test() {
                ValidationSelectorModel.result = result;
                ValidationSelectorModel.clicks = 0;
                const action = document.querySelector("#ValidationSelectorModel #action");
                const event = new MouseEvent("click", {bubbles:true, cancelable:true});
                Assert.assertEquals(expectedDefault, action.dispatchEvent(event));
                Assert.assertEquals(expectedClick, ValidationSelectorModel.clicks);
                Assert.assertEquals(!expectedDefault, event.defaultPrevented);
            }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
    <form id="ValidationSelectorModel" composite>
      <input id="field" class="validation-field" validate events="change"
          message="{{fault:'Fallback'}}"/>
      <input id="other" class="validation-field" validate events="change"/>
      <input id="required" required validate events="change" message="Required"/>
      <button id="action" type="button" validate events="click">Action</button>
    </form>
  </body>
</html>
