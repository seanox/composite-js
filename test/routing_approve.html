<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        // The test demonstrates state transitions when routing between #modelA,
        // #modelB, and #modelC. Depending on the active path, the corresponding
        // HTML elements are added to or removed from the DOM.
        //
        // Additionally, each model can control access through an optional
        // permit() method. If the method exists, it is called when the path
        // matches. Its return value determines whether the element remains in
        // the DOM.
        //
        // A special case is modelB: if an HTML element with the ID modelB
        // exists, named access on the Window object can cause window.modelB to
        // reference the HTML element instead of the JavaScript model. In this
        // case, the model's permit() method may not be called. For this reason,
        // modelA is explicitly registered on the window object.
        //
        // In practice, this conflict rarely occurs because modules generally
        // assign their exported objects to the window object correctly.
        //
        // The test makes routing states, permit() calls, and their effects on
        // the DOM visible and verifiable.
        //
        // Reference: Named access on the Window object
        // https://html.spec.whatwg.org/multipage/nav-history-apis.html#named-access-on-the-window-object

        let _permits = "";

        window.modelA = {
            permit() {
                _permits += "a";
                return _collector.length < 6 || _collector.length > 14;
            }
        };

        const modelB = {
            permit() {
                _permits += "b";
            }
        };

        let _count = 0;
        const _collector = [];
        const collectEventLog = (event) => {
            const modelA = document.querySelectorAll('[id^="modelA"]');
            const modelB = document.querySelectorAll('[id^="modelB"]');
            const modelPresence = `${modelA.length ? "A" : ""}${modelB.length ? "B" : ""}`;
            const log = [++_count, event, window.location.hash, _permits, modelPresence, _sequence.length].join(" ")
            console.log(log);
            if (_sequence)
                _collector.push(log);
        }

        let _sequence = ["#modelA", "#modelB", "#modelC", "#modelB", "#modelA", "#modelC", "#modelA", "#modelB", "#modelC", "#modelB", "#modelA"];
        Composer.listen(Composer.EVENT_RENDER_START, (event) => {
            collectEventLog(event);
        });

        Composer.listen(Composer.EVENT_RENDER_END, (event) => {
            collectEventLog(event);
            if (!_sequence)
                return;
            if (_sequence.length <= 0) {
                _sequence = false;
                document.body.innerText = _collector.join("\r\n");
                Test.start();
                return;
            }
            _permits = "";
            window.setTimeout(() => {
                Routing.route(_sequence.shift());
            }, 250);
        });

        // Important are 5-9
        // In which modelB.permit() finds decisions outside the path coverage
        Test.create({test() {
            const content = _collector.join("\r\n");
            console.debug(content);
            Assert.assertSameTo("script[type='text/test']", content);
        }});
    </script>
    <script type="text/test">
      1 composerRenderStart   AB 11
      2 composerRenderEnd  ab A 11
      3 composerRenderStart #modelA  A 10
      4 composerRenderEnd #modelA ab A 10
      5 composerRenderStart #modelB  A 9
      6 composerRenderEnd #modelB ab AB 9
      7 composerRenderStart #modelC  AB 8
      8 composerRenderEnd #modelC a  8
      9 composerRenderStart #modelB   7
      10 composerRenderEnd #modelB ab B 7
      11 composerRenderStart #modelA  B 6
      12 composerRenderEnd #modelA a  6
      13 composerRenderStart #modelC   5
      14 composerRenderEnd #modelC ab  5
      15 composerRenderStart #modelA   4
      16 composerRenderEnd #modelA ab A 4
      17 composerRenderStart #modelB  A 3
      18 composerRenderEnd #modelB ab AB 3
      19 composerRenderStart #modelC  AB 2
      20 composerRenderEnd #modelC a A 2
      21 composerRenderStart #modelB  A 1
      22 composerRenderEnd #modelB ab AB 1
      23 composerRenderStart #modelA  AB 0
      24 composerRenderEnd #modelA a A 0
    </script>
  </head>
  <body route>
    <div>
      <span id="modelA" composite route>A</span>
      <span id="modelB" composite route>B</span>
    </div>
    <div>[ {{_collector.length}}: {{window.location.hash}} {{_permits}} ]</div>
  </body>
</html>
