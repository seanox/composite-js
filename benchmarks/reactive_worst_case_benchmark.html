<!DOCTYPE html>
<html>
  <head>
    <title>Seanox aspect-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="aspect-js.js"></script>
    <script type="text/javascript">

        Test.activate();

        const state = {counter: 0}.reactive();
        const result = {duration: ""}.reactive();

        let phase = 0;
        let timing;

        Composite.listen(Composite.EVENT_RENDER_END, () => {
            phase++;
            if (phase === 1) {
                timing = performance.now();
                state.counter++;
            } else if (phase === 2) {
                const elapsed = performance.now() -timing;
                result.duration = `Duration ${elapsed.toFixed(0)} ms`;
                Test.create({test() {
                    const message = `${elapsed.toFixed(0)} ms`;
                    console.log(`Benchmark: ${message}`);
                }});
                Test.start();
            }
        });
    </script>
  </head>
  <body>
    Info: Output is hidden
    <div iterate="{{row:new Array(10000)}}" style="display:none;">{{state.counter}}</div>
    <p id="duration">{{result.duration}}</p>
  </body>
</html>
