<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        Test.create({test() {
            DataSource.localize("xx");
            Assert.assertEquals("xxA", Messages["all.a"]);
            Assert.assertEquals("xxB", Messages["all.b"]);
            // xx is declared multiple times, the first one wins
            Assert.assertEquals("xxX", Messages["xx"]);
            Assert.assertEquals(undefined, Messages["xde"]);
            Assert.assertEquals(undefined, Messages["xen"]);
        }});
        
        Test.create({test() {
            DataSource.localize("xde");
            Assert.assertEquals("xdeA", Messages["all.a"]);
            Assert.assertEquals("xdeB", Messages["all.b"]);
            // xde is declared multiple times, the first one wins
            Assert.assertEquals("xdeX", Messages["xde"]);
            Assert.assertEquals(undefined, Messages["xx"]);
            Assert.assertEquals(undefined, Messages["xen"]);
        }});
        
        Test.create({test() {
            DataSource.localize("xen");
            Assert.assertEquals("xenA", Messages["all.a"]);
            Assert.assertEquals("xenB", Messages["all.b"]);
            // xde is declared multiple times, the first one wins
            Assert.assertEquals("xenX", Messages["xen"]);
            Assert.assertEquals(undefined, Messages["xx"]);
            Assert.assertEquals(undefined, Messages["xde"]);
        }});
        
        Test.create({test() {
            DataSource.localize("_1");
            Assert.assertEquals("#_1", Messages["xxx"]);
            Assert.assertEquals("_1", DataSource.locale);
        }});
        Test.create({test() {
            DataSource.localize("xde_de");
            Assert.assertEquals("#xde_de", Messages["xxx"]);
            Assert.assertEquals("xde_de", DataSource.locale);
        }});
        Test.create({test() {
            DataSource.localize("xde-de");
            Assert.assertEquals("#xde-de", Messages["xxx"]);
            Assert.assertEquals("xde-de", DataSource.locale);
        }});

        Test.create({test() {
            DataSource.localize("xx");
            Assert.assertEquals("placeholders 1:{1} 1:{1} 3:{3} 2:{2} 98:{98} 99:{99}--", Messages["placeholder"]);
            Assert.assertEquals("placeholders 1: 1: 3: 2: 98: 99:--", Messages.populate("placeholder", "A"));
            Assert.assertEquals("placeholders 1:B 1:B 3: 2: 98: 99:--", Messages.populate("placeholder", "A", "B"));
            Assert.assertEquals("placeholders 1:B 1:B 3: 2:C 98: 99:--", Messages.populate("placeholder", "A", "B", "C"));
            Assert.assertEquals("placeholders 1:B 1:B 3:D 2:C 98: 99:--", Messages.populate("placeholder", "A", "B", "C", "D"));
        }});

        ["$&", "$$", "$`", "$'"].forEach(value => {
            Test.create({name:"Messages.populate keeps " + value + " literal", test() {
                DataSource.localize("xx");
                Assert.assertEquals("Hello " + value + "!", Messages.populate("placeholder.single", value));
            }});
        });

        Test.create({name:"Messages.populate does not replace inserted later placeholders", test() {
            DataSource.localize("xx");
            Assert.assertEquals("Hello {1} WORLD!", Messages.populate("placeholder.pair", "{1}", "WORLD"));
        }});

        Test.create({name:"Messages.populate does not remove inserted earlier placeholders", test() {
            DataSource.localize("xx");
            Assert.assertEquals("Hello WORLD {0}!", Messages.populate("placeholder.pair", "WORLD", "{0}"));
        }});

        Test.create({name:"Messages.populate does not remove inserted missing placeholders", test() {
            DataSource.localize("xx");
            Assert.assertEquals("Hello {99}!", Messages.populate("placeholder.single", "{99}"));
        }});

        Test.create({name:"Messages.populate preserves repeated and canonical placeholder indices", test() {
            DataSource.localize("xx");
            const values = Array.from({length:100}, (value, index) => String(index));
            Assert.assertEquals("placeholders 1:1 1:1 3:3 2:2 98:98 99:99--", Messages.populate("placeholder", ...values));
            Assert.assertEquals("0|||1|10", Messages.populate("placeholder.indices", ...values));
        }});

        Test.create({name:"Messages.populate distinguishes missing arguments from supplied values", test() {
            DataSource.localize("xx");
            Assert.assertEquals("Hello !", Messages.populate("placeholder.single"));
            Assert.assertEquals("Hello !", Messages.populate("placeholder.single", ""));
            Assert.assertEquals("Hello undefined!", Messages.populate("placeholder.single", undefined));
            Assert.assertEquals("Hello null!", Messages.populate("placeholder.single", null));
            Assert.assertEquals("Hello false!", Messages.populate("placeholder.single", false));
            Assert.assertEquals("Hello 0!", Messages.populate("placeholder.single", 0));
        }});

        Test.create({name:"Messages.populate ignores unused values and returns empty text for missing labels", test() {
            DataSource.localize("xx");
            Assert.assertEquals("Hello A B!", Messages.populate("placeholder.pair", "A", "B", "unused"));
            Assert.assertEquals("", Messages.populate("missing.placeholder", "unused"));
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
