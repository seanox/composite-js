<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();
        
        Namespace.use()["probeCondition"] = true;
        let probeSelectorCount = 0;
        Composer.customize("[data-probe]", () => {
            probeSelectorCount++;
        });

        const insertTestValue = (element, value) => {
            if (element.textContent.match(new RegExp(value)))
                return;
            const text = document.createElement("span");
            text.textContent = value;
            element.appendChild(text);
        };
        Composer.customize("[value]", (element) => {
            insertTestValue(element, 0);
        });
        Composer.customize("[value='xx3']", (element) => {
            insertTestValue(element, 3);
        });
        Composer.customize("[value='xx3']", (element) => {
            insertTestValue(element, 31);
        });        
        Composer.customize("[value='xx4']", (element) => {
            insertTestValue(element, 4);
            return false;
        });
        Composer.customize("[value='xx5']", (element) => {
            insertTestValue(element, 5);
        });
        
        Test.create({test() {
            Assert.assertSameTo("script[type='text/test']", document.body.textContent);
        }});

        Test.create({test() {
            Assert.assertEquals("2", window["probeText"].textContent);
            Assert.assertEquals("4", window["probeTextHit"].textContent);
            Assert.assertTrue(probeSelectorCount > 0);
            Assert.assertFalse(String(console.output.error)
                .includes("selector.matches is not a function"));
        }});

        Test.create({async test() {
            for (const condition of [false, true]) {
                Namespace.use()["probeCondition"] = condition;
                await new Promise(resolve => {
                    Composer.listen(Composer.EVENT_RENDER_END, (event, selector) => {
                        if (selector === document.body)
                            resolve();
                    });
                    Composer.render(document.body);
                });
                Assert.assertEquals(condition,
                    Boolean(window["probeCondition"]));
            }
        }});
        
        let count = 0;
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            if (++count === 3)
                Test.start();
        });
    </script>
    <script type="text/test">
      xa0
      xb0
      xc031
      xd04
      xe05 
      2
      4
      probe
    </script>
  </head>
  <body>
    <x value="xx1">xa</x>
    <x value="xx2">xb</x>
    <x value="xx3">xc</x>
    <x value="xx4">xd</x>
    <x value="xx5">xe</x>    
    <span id="probeText">{{1 + 1}}</span>
    <span id="probeTextHit" data-probe>{{2 + 2}}</span>
    <span id="probeCondition" condition="{{probeCondition}}">probe</span>
    <span data-probe></span>
  </body>
</html>
