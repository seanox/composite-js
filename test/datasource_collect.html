<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        Test.create({name:"collect without locators returns null", test() {
            Assert.assertEquals(null, DataSource.collect());
        }});

        [[null], [{}], ["xml://datasource_collect_a", null]].forEach(locators =>
            Test.create({name:"collect rejects invalid inputs " + JSON.stringify(locators),
                expected:/\bInvalid xml locator: object/i, test() {
                    DataSource.collect(...locators);
                }}));

        [
            ["collection", ["a"], "collect_a"],
            ["collection", ["a", "b", "c"], "collect_a,collect_b,collect_c"],
            ["documents", ["b", "a"], "collect_b,collect_a"],
            ["collection", ["a", "a", "b"], "collect_a,collect_a,collect_b"]
        ].forEach(([collector, inputs, expected]) =>
            Test.create({name:"collect preserves " + collector + " inputs " + inputs.join(","), test() {
                const locators = inputs.map(input => "xml://datasource_collect_" + input);
                const collection = collector === "collection"
                    ? DataSource.collect(...locators) : DataSource.collect(collector, ...locators);
                Assert.assertTrue(collection instanceof XMLDocument);
                Assert.assertEquals(collector, collection.documentElement.nodeName);
                Assert.assertEquals(expected, Array.from(collection.documentElement.children)
                    .map(node => node.getAttribute("id")).join(","));
            }}));

        Test.create({name:"Review #33: collect handles XPath selecting the document node", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            const document = DataSource.collect(locator);
            const collection = DataSource.collect(locator + "?/");
            Assert.assertTrue(document.documentElement.isEqualNode(collection.documentElement));
            const mixed = DataSource.collect("documents", locator + "?/ | /*");
            Assert.assertEquals(2, mixed.querySelectorAll("documents > test[id='collect_a']").length);
        }});

        Test.create({name:"collect wraps XPath attributes as nodes", test() {
            const collection = DataSource.collect("xml://datasource_collect_a?//*/@test");
            Assert.assertEquals("attribute:aa,attribute:bb,attribute:cc",
                Array.from(collection.documentElement.children)
                    .map(node => node.nodeName + ":" + node.getAttribute("test")).sort().join(","));
        }});

        Test.create({name:"collect wraps string, number and boolean XPath results in text elements", test() {
            const locator = "xml:/data/xx/datasource_collect_a.xml";
            const collection = DataSource.collect("values",
                locator + "?string(/test/title)",
                locator + "?count(/test/title)",
                locator + "?boolean(/test/missing)");
            Assert.assertEquals("text:Collect A,text:1,text:false",
                Array.from(collection.documentElement.children)
                    .map(node => node.nodeName + ":" + node.textContent).join(","));
        }});

        Test.create({name:"collect reports a missing resource among valid inputs",
            expected:/\bHTTP status 404 for .*\/datasource_collect_d\.xml\b/i, test() {
                DataSource.collect("xml://datasource_collect_a", "xml://datasource_collect_b", "xml://datasource_collect_d");
            }});

        Test.create({name:"Repeated collections fetch every input and return independent documents", test() {
            const locator = "xml://datasource_collect_a";
            const fetch = DataSource.fetch;
            let calls = 0;
            DataSource.fetch = entry => {
                calls++;
                return fetch.call(DataSource, entry);
            };
            try {
                const first = DataSource.collect(locator, locator);
                first.documentElement.setAttribute("changed", "yes");
                first.documentElement.children[0].setAttribute("id", "changed");
                Assert.assertEquals("collect_a", first.documentElement.children[1].getAttribute("id"));
                const repeated = DataSource.collect(locator, locator);
                Assert.assertEquals(4, calls);
                Assert.assertNotEquals(first, repeated);
                Assert.assertFalse(repeated.documentElement.hasAttribute("changed"));
                Assert.assertEquals("collect_a", repeated.documentElement.children[0].getAttribute("id"));
            } finally {
                DataSource.fetch = fetch;
            }
        }});

        Test.create({name:"Review #32: collect follows locale changes", test() {
            const locale = DataSource.locale;
            const locator = "xml:/datasource_collect_locale";
            try {
                DataSource.localize("xen");
                Assert.assertEquals("English", DataSource.collect(locator).documentElement.textContent);

                DataSource.localize("xde");
                Assert.assertEquals("Collection must use the current locale",
                    "Deutsch", DataSource.collect(locator).documentElement.textContent);

                DataSource.localize("xen");
                Assert.assertEquals("English", DataSource.collect(locator).documentElement.textContent);
            } finally {
                DataSource.localize(locale);
            }
        }});

        Test.create({name:"Review #32: collect localizes mixed XPath and explicit inputs", test() {
            const locale = DataSource.locale;
            const locator = "xml:/datasource_collect_locale?string(/test)";
            const explicit = "xml:/data/xen/datasource_collect_locale.xml";
            try {
                DataSource.localize("xen");
                Assert.assertEquals("EnglishEnglish",
                    DataSource.collect("mixed", locator, explicit).documentElement.textContent);
                DataSource.localize("xde");
                Assert.assertEquals("DeutschEnglish",
                    DataSource.collect("mixed", locator, explicit).documentElement.textContent);
            } finally {
                DataSource.localize(locale);
            }
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
