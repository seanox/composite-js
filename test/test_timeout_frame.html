<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="composite-js-testing.js"></script>
    <script>
        Test.activate();

        // Runs parent-supplied tests in an isolated iframe
        // and forwards results and errors.

        window.addEventListener("error", event =>
            parent.postMessage({type: "error", message: event.message}, "*"));
        window.addEventListener("unhandledrejection", event => {
            event.preventDefault();
            parent.postMessage({type: "unhandled"}, "*");
        });
        Test.listen(Test.EVENT_RESPONSE, (event, status) =>
            parent.postMessage({
                type: "response",
                title: status.task.title,
                error: status.task.error && status.task.error.message,
                faults: status.queue.faults
            }, "*"));
        Test.listen(Test.EVENT_INTERRUPT, () =>
            parent.postMessage({type: "interrupt"}, "*"));
        Test.listen(Test.EVENT_FINISH, (event, status) =>
            parent.postMessage({
                type: "finish",
                faults: status.queue.faults,
                progress: status.queue.progress,
                size: status.queue.size
            }, "*"));

        window.addEventListener("message", event => {
            if (event.source !== parent
                    || !event.data
                    || event.data.type !== "run")
                return;
            try {
                new Function(event.data.source)();
                Test.start();
            } catch (error) {
                parent.postMessage({type: "error", message: error.message}, "*");
            }
        });
    </script>
  </head>
  <body>
  </body>
</html>
