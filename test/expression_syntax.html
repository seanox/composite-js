<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Expression Syntax</title>
    <script src="composite-js-testing.js"></script>
    <script>

      Test.activate();

      for (const [source, expected] of [
          ["{{true && false}}", false],
          ["{{true && true}}", true],
          ["{{false || true}}", true],
          ["{{!false}}", true],
          ["{{!!'x'}}", true],
          ["{{!''}}", true],
          ["{{![]}}", false],
          ["{{1 == '1'}}", true],
          ["{{1 === '1'}}", false],
          ["{{1 != '1'}}", false],
          ["{{1 !== '1'}}", true],
          ["{{1 < 2}}", true],
          ["{{2 <= 2}}", true],
          ["{{2 > 1}}", true],
          ["{{2 >= 2}}", true],
          ["{{25 / 5}}", 5],
          ["{{10 % 3}}", 1],
          ["{{(25 / 5) == 5}}", true],
          ["{{10 / 2 % 3}}", 2],
          ["{{true\t&&\ttrue}}", true],
          ["{{true\n&&\rtrue}}", true],
          ["{{' :and :or :not :empty :eq :eeq :ne :nee :lt :gt :le :ge :div :mod '}}",
              " :and :or :not :empty :eq :eeq :ne :nee :lt :gt :le :ge :div :mod "],
          ["{{'a:and b'}}", "a:and b"],
          ["{{'a :and(b)'}}", "a :and(b)"],
          ["{{'a :AND b'}}", "a :AND b"],
          ["{{'a :unknown b'}}", "a :unknown b"],
          [String.raw`{{'a \u003aand b'}}`, "a :and b"],
          ["{{`a :and b ${1 + 2}`}}", "a :and b 3"],
          ["{{/a :and b/.source}}", "a :and b"],
          ["{{/['\"`]/.test('x') || true}}", true],
          ["{{1 /* :and ' \" ` */ + 2}}", 3],
          ["{{'a  b\tc'}}", "a  b\tc"],
          ["{{`a\r\nb`}}", "a\nb"],
          [String.raw`{{'a\r\nb'}}`, "a\r\nb"],
          ["{{'a\\\nb'}}", "ab"],
          ["{{'a\\\r\nb'}}", "ab"],
          ["{{1 // comment\n + 2}}", 3],
          ["{{1 // comment\r + 2}}", 3],
          ["{{1 // comment\r\n + 2}}", 3],
          ["{{let number = 2\nnumber + 3}}", 5],
          ["{{(() => { return\n7; })()}}", undefined],
          ["{{({outer: {value: 3} }).outer.value}}", 3],
          ["{{(() => { return 7; })()}}", 7],
          ["{{let value = 2; value + 3}}", 5],
          ["{{'abc' + \"def\"}}", "abcdef"],
          [String.raw`{{'abc\'d\"ef'}}`, "abc'd\"ef"],
          [String.raw`{{"abc\\" + 'def\\'}}`, "abc\\def\\"],
          ["{{and + not + empty}}", 6],
          ["{{object.and + object.not}}", 3],
          ["{{value}}", "a :and b"],
          ["{{'#import module'}}", "#import module"],
          ["{{'#use Example'}}", "#use Example"]
      ])
          Test.create({test() {
              const context = {and:1, not:2, empty:3, object:{and:1, not:2},
                  value:"a :and b"};
              const result = Expression.eval(context, source);
              Assert.assertEquals(2, result.length);
              Assert.assertEquals(undefined, result[0]);
              Assert.assertEquals(source, expected, result[1]);
          }});

      for (const source of [
          "{{true and false}}", "{{not false}}", "{{empty ''}}",
          "{{:and false}}", "{{:not false}}", "{{true :and false}}",
          "{{test :and 123}}",
          "{{1:and false}}",
          "{{1 : value}}", "{{1 :and(false)}}", "{{:not(false)}}",
          "{{1 :AND false}}", "{{#HiddenField}}", "{{#(HiddenField)}}",
          "{{#[HiddenField]}}", "{{#import module}}", "{{#export value}}",
          "{{#use Example}}", "{{throw\nnew Error('failure')}}",
          "{{/a\nb/.test('ab')}}"
      ])
          Test.create({test() {
              const errors = [];
              const original = console.error;
              let result;
              console.error = error => errors.push(error);
              try {result = Expression.eval({}, source);
              } finally {
                  console.error = original;
              }
              Assert.assertEquals(2, result.length);
              Assert.assertEquals(undefined, result[0]);
              Assert.assertTrue(source, result[1] instanceof SyntaxError);
              Assert.assertEquals(1, errors.length);
          }});

      Test.create({test() {
          const element = document.getElementById("HiddenField");
          Assert.assertEquals(element,
              Expression.eval({}, "{{document.getElementById('HiddenField')}}")[1]);
          Assert.assertEquals("Test-HF",
              Expression.eval({}, "{{document.getElementById('HiddenField').value}}")[1]);
          Assert.assertNull(
              Expression.eval({}, "{{document.getElementById('Nothing')}}")[1]);
      }});

      Test.start({auto:true});
    </script>
  </head>
  <body>
    <input type="hidden" id="HiddenField" value="Test-HF">
  </body>
</html>
