<!DOCTYPE html>
<html>
  <head>
    <title>Seanox composite-js Benchmark</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="composite-js.js"></script>
    <script type="text/javascript">

       Test.activate();

       const model = {value: 0}.reactive();
       const result = {duration: ""}.reactive();
      
       let initialRenderDone = false;
       let finished = false;
       let timing;
       let renderCount = 0;
       let checkTask;
       let lastRender;
      
       Composer.listen(Composer.EVENT_RENDER_END, () => {

           if (finished)
               return;
      
           lastRender = performance.now();
      
           if (!initialRenderDone) {
               initialRenderDone = true;
               timing = performance.now();
               renderCount = 0;
               for (let i = 0; i < 1000; i++)
                   model.value = i;
               return;
           }
      
           renderCount++;
           if (checkTask)
               checkTask.cancel();
           
           checkTask = Composer.asynchronous(() => {
               finished = true;
               const elapsed = lastRender - timing;
               result.duration = `Duration ${elapsed.toFixed(0)} ms`;
               Test.create({test() {
                   const message = `${elapsed.toFixed(0)} ms`;
                   console.log(`Benchmark: ${message}`);
               }});
               Test.start();
           });
       });    
    </script>
  </head>
  <body>
    <p id="target">{{model.value}}</p>
    <p id="duration">{{result.duration}}</p>
  </body>
</html>
