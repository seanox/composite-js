name: "🟨 GitHub Page: Build and Deploy"

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-page:
    uses: seanox/seanox-automation/workflows/github-page-update.yaml@1.x
    with:
      includes: |
        manuals
        release
        tutorials
        CHANGES
        README.md
