<!DOCTYPE html>
<html>
  <head>
    <meta charset="ISO-8859-1">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script src="scripts/capture.js"></script>
    <script type="text/javascript">
        Test.activate();

        const capture = new Capture();
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            capture.snap();
            const count = capture.patterns().length;
            if (capture.size() === count)
                Test.start();
            if (capture.size() > count)
                Assert.assertEquals("expected {1} steps but was {2}", count, capture.size());
        });

        Test.create({test() {
            capture.validate();
        }});

        const model = Reactive({
            get markup() {
                const markup = "<table><tr><td>A</td><td>B</td></tr></table>";
                const template = document.createElement("template");
                template.innerHTML = markup;
                return template.content.firstChild;
            }
        });
    </script>
    <script type="text/test">
      AB
    </script>
  </head>
  <body>
    <div output="{{model.markup}}"></div>
  </body>
</html>
