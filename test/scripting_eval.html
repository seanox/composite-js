<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const helpers = Scripting.run({}, "expose({require, use, expose, attempt});");

        Test.create({test() {
            const names = ["_require", "_expose", "_use", "_attempt"];
            const types = "[" + names.map(name => "typeof " + name).join(",") + "].join(',')";
            Assert.assertEquals("undefined,undefined,undefined,undefined", Scripting.eval({}, types));
            const context = Object.freeze({
                _require: "application require",
                _expose: "application expose",
                _use: "application use",
                _attempt: "application attempt"
            });
            Assert.assertEquals(Object.values(context).join(","),
                Scripting.eval(context, "[" + names.join(",") + "].join(',')"));
            for (const name of names)
                Assert.assertFalse(name, Object.prototype.hasOwnProperty.call(window, name));
        }});

        Test.create({async test() {
            const url = URL.createObjectURL(new Blob([
                "export default [typeof require, typeof use, typeof expose, typeof attempt].join(',');"
            ], {type: "text/javascript"}));
            try {
                const module = await Scripting.eval({url}, "import(url)");
                Assert.assertEquals("undefined,undefined,undefined,undefined", module.default);
            } finally {
                URL.revokeObjectURL(url);
            }
        }});

        Test.create({test() {
            for (const value of [undefined, null, 1, true, {}, [], () => {}, new String("invalid"), Symbol("invalid")]) {
                let error;
                try {helpers.require(value);
                } catch (exception) {
                    error = exception;
                }
                Assert.assertTrue(error instanceof TypeError);
            }
        }});

        Test.create({test() {
            const loads = [];
            const load = Composer.load;
            Composer.load = (...parameters) => loads.push(parameters);
            try {
                for (const path of ["", "/", "../module", "module.js", "foo-bar",
                    "foo//bar", "foo\\bar", "foo?x", " foo", "foo "]) {
                    let error;
                    try {helpers.require(path);
                    } catch (exception) {
                        error = exception;
                    }
                    Assert.assertTrue(path, error instanceof Error);
                    Assert.assertEquals("Invalid require: " + path, error.message);
                }
                Assert.assertEquals(0, loads.length);
            } finally {
                Composer.load = load;
            }
        }});

        Test.create({test() {
            const prototype = {inherited: 1};
            const namespace = Object.create(prototype);
            let assigned;
            Object.defineProperty(namespace, "accessor", {
                get() {throw new Error("Assignment must not read the target");},
                set(value) {assigned = value;}
            });
            Object.defineProperty(namespace, "readonly", {value: 1});
            Object.defineProperty(namespace, "getter", {get() {return 1;}});
            namespace.frozen = Object.freeze({value: 1});
            namespace.closed = Object.preventExtensions({});
            window.ScriptingGlobalAssignmentTest = namespace;
            try {
                const value = {};
                Assert.assertSame(value, helpers.expose(value, "ScriptingGlobalAssignmentTest.accessor"));
                Assert.assertSame(value, assigned);
                helpers.expose(value, "ScriptingGlobalAssignmentTest.inherited");
                Assert.assertSame(value, namespace.inherited);
                Assert.assertTrue(Object.prototype.hasOwnProperty.call(namespace, "inherited"));
                Assert.assertEquals(1, prototype.inherited);
                for (const name of ["readonly", "getter", "frozen.value", "closed.value"]) {
                    let error;
                    try {helpers.expose(value, "ScriptingGlobalAssignmentTest." + name);
                    } catch (exception) {
                        error = exception;
                    }
                    Assert.assertTrue(name, error instanceof TypeError);
                }
                Assert.assertEquals(1, namespace.readonly);
                Assert.assertEquals(1, namespace.getter);
                Assert.assertEquals(1, namespace.frozen.value);
                Assert.assertFalse("value" in namespace.closed);
            } finally {
                delete window.ScriptingGlobalAssignmentTest;
            }
        }});

        Test.create({test() {
            const includes = [];
            const load = Composer.load;
            Composer.load = (...parameters) => includes.push(parameters);
            try {
                helpers.require("runtime/first");
                helpers.require("runtime/second");
                Scripting.run({}, "require('runtime/third');");
                Assert.assertEquals(3, includes.length);
                ["first", "second", "third"].forEach((name, index) => {
                    Assert.assertEquals(Composer.MODULES + "/runtime/" + name + ".js",
                        includes[index][0]);
                    Assert.assertTrue(includes[index][1]);
                });
                const failure = new Error("Module loading failed");
                Composer.load = () => {throw failure;};
                let error;
                try {helpers.require("runtime/failure");
                } catch (exception) {
                    error = exception;
                }
                Assert.assertSame(failure, error);
            } finally {
                Composer.load = load;
            }
        }});

        Test.create({test() {
            try {
                helpers.use("ScriptingGlobalUseTest.a");
                helpers.use("ScriptingGlobalUseTest.b.c");
                const namespace = window.ScriptingGlobalUseTest.a;
                namespace.value = 123;
                helpers.use("ScriptingGlobalUseTest.a");
                Assert.assertSame(namespace, window.ScriptingGlobalUseTest.a);
                Assert.assertEquals(123, window.ScriptingGlobalUseTest.a.value);
                Assert.assertEquals("object", typeof window.ScriptingGlobalUseTest.b.c);
            } finally {
                delete window.ScriptingGlobalUseTest;
            }
        }});

        Test.create({test() {
            const context = Object.freeze({
                require: undefined, use: null, expose: "own expose", attempt: "own attempt"
            });
            Assert.assertEquals("undefined,,own expose,own attempt", Scripting.eval(
                context, "[typeof require, use, expose, attempt].join(',')"));
            Assert.assertEquals("require,use,expose,attempt", Object.keys(context).join(","));
            Assert.assertUndefined(context.require);
            Assert.assertNull(context.use);
            const calls = [];
            for (const value of ["first", "second"]) {
                const context = {require: path => calls.push(value + ":" + path)};
                Scripting.eval(context, "require('custom');");
                Assert.assertEquals("require", Object.keys(context).join(","));
            }
            Assert.assertEquals("first:custom,second:custom", calls.join(","));
            const special = JSON.parse('{"__proto__":"application prototype","constructor":"application constructor"}');
            Assert.assertEquals("application prototype,application constructor",
                Scripting.eval(special, "[__proto__, constructor].join(',')"));
        }});

        Test.create({test() {
            window.ScriptingGlobalDOMTest = {
                element: document.createElement("div"),
                collection: document.getElementsByTagName("script")
            };
            const object = {value: 123};
            try {
                helpers.expose(object, "ScriptingGlobalDOMTest.element");
                helpers.expose(object, "ScriptingGlobalDOMTest.collection");
                Assert.assertSame(object, window.ScriptingGlobalDOMTest.element);
                Assert.assertSame(object, window.ScriptingGlobalDOMTest.collection);
            } finally {
                delete window.ScriptingGlobalDOMTest;
            }
        }});

        Test.create({test() {
            const source = "\tuse(\r\n"
                + "    /* namespace */ 'ScriptingGlobalTextTest.used'\r\n"
                + "); // trailing  \r\n"
                + "/*\n require('unused');\n*/\r\n"
                + "const text = `\n  require('unused');\n`;\r\n"
                + "text";
            Assert.assertUndefined(window.ScriptingGlobalTextTest);
            try {
                Assert.assertEquals("\n  require('unused');\n", Scripting.eval({use: helpers.use}, source));
                Assert.assertEquals("object", typeof window.ScriptingGlobalTextTest.used);
            } finally {
                delete window.ScriptingGlobalTextTest;
            }
        }});

        Test.create({test() {
            const context = {
                script: "application script",
                require: "application require",
                expose: "application expose",
                use: "application use",
                attempt: "application attempt"
            };
            const script = "[script, require, expose, use, attempt].join(',')";
            const expected = Object.values(context).join(",");
            Assert.assertEquals(expected, Scripting.eval(context, script));
        }});

        Test.create({test() {
            Assert.assertEquals(
                    "local script,local require,local expose,local use,local attempt",
                    Scripting.eval(
                            {},
                            "const script = 'local script';\n"
                            + "const require = 'local require';\n"
                            + "const expose = 'local expose';\n"
                            + "const use = 'local use';\n"
                            + "const attempt = 'local attempt';\n"
                            + "[script, require, expose, use, attempt].join(',')"
                    )
            );
        }});

        Test.create({test() {
            const first = Scripting.eval(
                    {script: "first"},
                    "({runtime: this, value: script})"
            );
            const second = Scripting.eval(
                    {script: "second"},
                    "({runtime: this, value: script + ' updated'})"
            );
            Assert.assertEquals("first", first.value);
            Assert.assertEquals("second updated", second.value);
            Assert.assertNotSame(first.runtime, second.runtime);
            Assert.assertEquals("({runtime: this, value: script})", first.runtime.script);
            Assert.assertEquals(
                    "({runtime: this, value: script + ' updated'})",
                    second.runtime.script
            );
            Assert.assertEquals(
                    "script",
                    Object.keys(first.runtime).sort().join(",")
            );
            Assert.assertUndefined(first.runtime.require);
            Assert.assertUndefined(first.runtime.expose);
            Assert.assertUndefined(first.runtime.use);
            first.runtime.extra = true;
            Assert.assertEquals("script", Scripting.eval({}, "Object.keys(this).join(',')"));
            Assert.assertEquals("script", Scripting.eval({script: "third"}, "Object.keys(this).join(',')"));
            Scripting.prune(0);
            Assert.assertEquals("after pruning", Scripting.eval({script: "after pruning"}, "script"));
        }});

        Test.create({test() {
            const context = {value: 1};
            Assert.assertEquals(
                    3,
                    Scripting.eval(context, "value += 2; var scriptingRunLocal = value; value")
            );
            Assert.assertEquals(1, context.value);
            Assert.assertUndefined(window.scriptingRunLocal);
            Assert.assertUndefined(Scripting.eval({}, "(function() { return this; })()"));
            Assert.assertUndefined(Scripting.eval({}, " \n\t "));
            Assert.assertEquals(3, Scripting.eval({}, " \n1 + 2; "));
        }});

        Test.create({test() {
            try {
                Scripting.run(
                        {},
                        "(() => {\n"
                        + "use('ScriptingEvalThisTest.arrow');\n"
                        + "})();"
                );
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.arrow);

                [
                    "(function() {\n"
                    + "use('ScriptingEvalThisTest.unbound');\n"
                    + "})();",
                    "({method() {\n"
                    + "use('ScriptingEvalThisTest.method');\n"
                    + "}}).method();",
                    "[1].forEach(function() { use('ScriptingEvalThisTest.callback'); });"
                ].forEach(script => Scripting.run({}, script));
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.unbound);
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.method);
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.callback);
            } finally {
                delete window.ScriptingEvalThisTest;
            }
        }});

        Test.create({test() {
            for (const name of ["require", "use", "expose", "attempt"]) {
                Assert.assertEquals("own", Scripting.eval(helpers,
                    name + "(); function " + name + "() {return 'own';}"));
                for (const declaration of ["var", "let", "const"])
                    Assert.assertEquals("own", Scripting.eval(helpers,
                        declaration + " " + name + " = () => 'own'; " + name + "();"));
                Assert.assertEquals("undefined", Scripting.eval(helpers,
                    "typeof " + name + "; var " + name + ";"));
                let error;
                try {Scripting.eval(helpers, name + "(); const " + name + " = () => 'own';");
                } catch (exception) {
                    error = exception;
                }
                Assert.assertTrue(name, error instanceof ReferenceError);
                Scripting.eval(helpers, name + " = null;");
                Assert.assertSame(helpers[name], Scripting.eval(helpers, name));
            }
            Assert.assertEquals("function,own", Scripting.eval(helpers,
                "const connector = {expose() {return 'own';}};"
                + "[typeof expose, connector.expose()].join(',')"));
            const callback = Scripting.eval(helpers, "() => ({require, use, expose, attempt})");
            for (const name of Object.keys(helpers))
                Assert.assertSame(helpers[name], callback()[name]);
            Scripting.prune(0);
            Assert.assertSame(helpers.expose, Scripting.eval(helpers, "expose"));
        }});

        Test.create({test() {
            for (const value of [undefined, null, false, 0, "", {}, () => 42])
                Assert.assertSame(value, helpers.attempt(() => value));
            for (const error of [new Error("optional"), "optional", null, undefined]) {
                let calls = 0;
                Assert.assertUndefined(helpers.attempt(() => {
                    calls++;
                    throw error;
                }));
                Assert.assertEquals(1, calls);
            }
            Assert.assertSame(window, Scripting.eval({}, "attempt(function() {return this;})"));
            Assert.assertTrue(Scripting.eval({}, "attempt(() => this) === this"));
            const failure = new Error("asynchronous failure");
            const promise = Promise.reject(failure);
            promise.catch(() => {});
            Assert.assertSame(promise, helpers.attempt(() => promise));
        }});

        Test.start({auto:true});
    </script>
  </head>
  <body>
  </body>
</html>
