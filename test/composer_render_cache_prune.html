<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        const pruneLimits = [];
        const scriptingPrune = Scripting.prune;
        Scripting.prune = function(size) {
            pruneLimits.push(size);
            return scriptingPrune.call(this, size);
        };

        const delay = () => new Promise(resolve => window.setTimeout(resolve, 0));

        Test.create({timeout:10000, async test() {
            Assert.assertUndefined(Expression.prune);
            const fixture = document.createElement("div");
            document.body.appendChild(fixture);
            let stableLimit;
            try {
                await delay();
                for (let index = 0; index < 50; index++) {
                    const element = document.createElement("span");
                    element.textContent = "{{'cache-prune-" + index + "'}}";
                    fixture.appendChild(element);
                    await delay();

                    const count = pruneLimits.length;
                    fixture.removeChild(element);
                    await delay();

                    Assert.assertTrue(pruneLimits.length > count);

                    const limit = pruneLimits[pruneLimits.length -1];
                    if (stableLimit === undefined)
                        stableLimit = limit;
                    Assert.assertEquals(stableLimit, limit);
                }
            } finally {
                if (fixture.parentNode)
                    fixture.parentNode.removeChild(fixture);
                await delay();
            }
        }});

        let started = false;
        Composer.listen(Composer.EVENT_RENDER_END, () => {
            if (started)
                return;
            started = true;
            Test.start();
        });
    </script>
  </head>
  <body>
  </body>
</html>
