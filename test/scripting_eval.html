<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        // #use
        Test.create({test() {
            Assert.assertEquals('this.use(...["foo"]);',
                    Scripting.eval("", {}, "#use foo", true)
            );
            Assert.assertEquals(
                    'this.use(...["foo","bar"]);',
                    Scripting.eval("", {}, "#use foo bar", true)
            );
            Assert.assertEquals(
                    'this.use(...["foo"]);\n'
                    + 'const value = 123;',
                    Scripting.eval(
                            "",
                            {},
                            "#use foo\n"
                            + "const value = 123;",
                            true
                    )
            );
        }});

        // #export
        Test.create({test() {
            Assert.assertEquals('this.export(...[[value,"value"]]);',
                    Scripting.eval("", {}, "#export value", true));
            Assert.assertEquals('this.export(...[[value,"value","foo"]]);',
                    Scripting.eval("", {}, "#export value@foo", true));
            Assert.assertEquals('this.export(...[[foo,"foo"],[bar,"bar"]]);',
                    Scripting.eval("", {}, "#export foo bar", true));
            Assert.assertEquals(
                    'const value = 123;\n'
                    + 'this.export(...[[value,"value"]]);',
                    Scripting.eval(
                            "",
                            {},
                            "const value = 123;\n"
                            + "#export value",
                            true
                    )
            );
        }});

        // #import
        Test.create({test() {
            Assert.assertEquals('this.import(...["foo"]);',
                    Scripting.eval("", {}, "#import foo", true));
            Assert.assertEquals('this.import(...["foo","bar"]);',
                    Scripting.eval("", {}, "#import foo bar", true));
            Assert.assertEquals(
                    'this.import(...["foo"]);\n'
                    + 'const value = 123;',
                    Scripting.eval(
                            "",
                            {},
                            "#import foo\n"
                            + "const value = 123;",
                            true
                    )
            );
        }});

        // Macro lines preserve line endings and source position.
        Test.create({test() {
            Assert.assertEquals(
                    'this.import(...["moduleA"]);\r\n'
                    + 'const value = 123;',
                    Scripting.eval(
                            "",
                            {},
                            "\t#import moduleA\r\n"
                            + "const value = 123;",
                            true
                    )
            );
            Assert.assertEquals(
                    'const text = `\n'
                    + 'this.import(...["moduleA"]);\n'
                    + '`;',
                    Scripting.eval(
                            "",
                            {},
                            "const text = `\n"
                            + "    #import moduleA\n"
                            + "`;",
                            true
                    )
            );
            Assert.assertEquals(
                    '\nthis.import(...["moduleA"]);\n',
                    Scripting.eval(
                            "",
                            {},
                            "`\n#import moduleA\n`"
                    )
            );
            Assert.assertEquals(
                    '/*\n'
                    + 'this.use(...["example.namespace"]);\n'
                    + '*/',
                    Scripting.eval(
                            "",
                            {},
                            "/*\n"
                            + "#use example.namespace\n"
                            + "*/",
                            true
                    )
            );
            Assert.assertEquals(
                    'const text = "#import moduleA";',
                    Scripting.eval("", {}, 'const text = "#import moduleA";', true)
            );
        }});

        // Generated macro calls retain JavaScript control flow and use helpers.
        Test.create({test() {
            Scripting.eval(
                    "",
                    {},
                    "const scriptingEvalMacro = 123;\n"
                    + "if (true)\n"
                    + "    #export scriptingEvalMacro@ScriptingEvalMacroTest\n"
                    + "if (false)\n"
                    + "    #export missingMacroValue@ScriptingEvalMacroTest"
            );
            Assert.assertEquals(
                    123,
                    window.ScriptingEvalMacroTest.scriptingEvalMacro
            );
            delete window.ScriptingEvalMacroTest;
        }});

        // A trimmed line comment is reattached.
        Test.create({test() {
            Assert.assertEquals(
                    'this.import(...["moduleA","moduleB"]); // trailing\n'
                    + 'moduleC',
                    Scripting.eval(
                            "",
                            {},
                            "#import moduleA moduleB // trailing  \n"
                            + "moduleC",
                            true
                    )
            );
            Assert.assertEquals(
                    'this.import(...["moduleA"]);\n'
                    + 'moduleB',
                    Scripting.eval(
                            "",
                            {},
                            "#import moduleA\n"
                            + "moduleB",
                            true
                    )
            );
        }});

        // Block comments are not supported in macro arguments.
        Test.create({test() {
            let error;
            try {Scripting.eval("", {}, "#import moduleA /* comment */ moduleB", true);
            } catch (exception) {
                error = exception;
            }
            Assert.assertEquals(true, error instanceof SyntaxError);
            Assert.assertEquals(
                    "Unexpected Token: #import moduleA /* comment */ moduleB",
                    error && error.message
            );
            Assert.assertEquals(
                    'this.import(...["moduleA"]); // /* unterminated',
                    Scripting.eval("", {}, "#import moduleA // /* unterminated", true)
            );
        }});

        // A semicolon does not terminate a macro directive.
        Test.create({test() {
            let message;
            try {Scripting.eval("", {}, "#import moduleA; const value = 123;", true);
            } catch (error) {
                message = error.message;
            }
            Assert.assertEquals(
                    "Invalid macro: #import moduleA; const value = 123;",
                    message
            );
        }});

        // Combination of all macros
        Test.create({test() {
            Assert.assertEquals(
                    'this.use(...["foo"]);\n'
                    + 'this.import(...["bar"]);\n'
                    + 'const value = 123;\n'
                    + 'this.export(...[[value,"value"]]);',
                    Scripting.eval(
                            "",
                            {},
                            "#use foo\n"
                            + "#import bar\n"
                            + "const value = 123;\n"
                            + "#export value",
                            true
                    )
            );
        }});

        // Source URL / debug mode
        Test.create({test() {
            Assert.assertEquals(
                    "const value = 123;\n\n//# sourceURL=scripting_eval.html\n",
                    Scripting.eval(
                            "scripting_eval.html",
                            {},
                            "const value = 123;",
                            true
                    )
            );
        }});

        // No debug: script is actually executed
        Test.create({test() {
            Assert.assertEquals(3, Scripting.eval("scripting_eval.html", {}, "1 + 2"));
        }});

        Test.create({test() {
            const context = {
                script: "application script",
                _import: "application import",
                _export: "application export",
                _use: "application use"
            };
            const script = "[script, _import, _export, _use].join(',')";
            const expected = Object.values(context).join(",");
            Assert.assertEquals(3, Scripting.run(context, "1 + 2"));
            Assert.assertEquals(expected, Scripting.run(context, script));
            Assert.assertEquals(expected, Scripting.eval(context, script));
        }});

        Test.create({test() {
            const context = {
                script: "application script",
                _import: "application import",
                _export: "application export",
                _use: "application use"
            };
            const imports = [];
            const load = Composer.load;
            Composer.load = (...parameters) => imports.push(parameters);
            try {
                const result = Scripting.eval(
                        context,
                        "#import runtime/helper runtime/other\n"
                        + "#use ScriptingEvalRuntimeTest.namespace\n"
                        + "#export script@ScriptingEvalRuntimeTest"
                        + " _import@ScriptingEvalRuntimeTest"
                        + " _export@ScriptingEvalRuntimeTest"
                        + " _use@ScriptingEvalRuntimeTest\n"
                        + "[script, _import, _export, _use].join(',')"
                );
                Assert.assertEquals(Object.values(context).join(","), result);
                Object.keys(context).forEach(key =>
                    Assert.assertSame(context[key], window.ScriptingEvalRuntimeTest[key]));
                Assert.assertEquals("object", typeof window.ScriptingEvalRuntimeTest.namespace);
                Assert.assertEquals(2, imports.length);
                Assert.assertEquals(Composer.MODULES + "/runtime/helper.js", imports[0][0]);
                Assert.assertEquals(Composer.MODULES + "/runtime/other.js", imports[1][0]);
                Assert.assertTrue(imports[0][1]);
                Assert.assertTrue(imports[1][1]);
            } finally {
                Composer.load = load;
                delete window.ScriptingEvalRuntimeTest;
            }
        }});

        Test.create({test() {
            try {
                Assert.assertEquals(
                        "local script,local import,local export,local use",
                        Scripting.eval(
                                {},
                                "const script = 'local script';\n"
                                + "const _import = 'local import';\n"
                                + "const _export = 'local export';\n"
                                + "const _use = 'local use';\n"
                                + "#use ScriptingEvalLocalTest\n"
                                + "#export script@ScriptingEvalLocalTest\n"
                                + "[script, _import, _export, _use].join(',')"
                        )
                );
                Assert.assertEquals("local script", window.ScriptingEvalLocalTest.script);
                Assert.assertEquals(
                        "undefined,undefined,undefined,undefined",
                        Scripting.run({}, "[typeof script, typeof _import,"
                                + " typeof _export, typeof _use].join(',')")
                );
            } finally {
                delete window.ScriptingEvalLocalTest;
            }
        }});

        Test.create({test() {
            const first = Scripting.run(
                    {script: "first"},
                    "({runtime: this, value: script})"
            );
            const second = Scripting.run(
                    {script: "second"},
                    "({runtime: this, value: script + ' updated'})"
            );
            Assert.assertEquals("first", first.value);
            Assert.assertEquals("second updated", second.value);
            Assert.assertNotSame(first.runtime, second.runtime);
            Assert.assertEquals("({runtime: this, value: script})", first.runtime.script);
            Assert.assertEquals(
                    "({runtime: this, value: script + ' updated'})",
                    second.runtime.script
            );
            Assert.assertEquals(
                    "export,import,script,use",
                    Object.keys(first.runtime).sort().join(",")
            );
            Assert.assertSame(first.runtime.import, second.runtime.import);
            Assert.assertSame(first.runtime.export, second.runtime.export);
            Assert.assertSame(first.runtime.use, second.runtime.use);
            first.runtime.use = null;
            Assert.assertEquals("function", typeof Scripting.run({}, "this.use"));
            Assert.assertEquals("function", typeof Scripting.run({script: "third"}, "this.use"));
            Scripting.prune(0);
            Assert.assertEquals("after pruning", Scripting.run({script: "after pruning"}, "script"));
        }});

        Test.create({test() {
            const context = {value: 1};
            Assert.assertEquals(
                    3,
                    Scripting.run(context, "value += 2; var scriptingRunLocal = value; value")
            );
            Assert.assertEquals(1, context.value);
            Assert.assertUndefined(window.scriptingRunLocal);
            Assert.assertUndefined(Scripting.run({}, "(function() { return this; })()"));
            Assert.assertUndefined(Scripting.run({}, " \n\t "));
            Assert.assertEquals(3, Scripting.run({}, " \n1 + 2; "));
        }});

        Test.create({test() {
            try {
                Scripting.eval(
                        {},
                        "(() => {\n"
                        + "#use ScriptingEvalThisTest.arrow\n"
                        + "})();\n"
                        + "(function() {\n"
                        + "#use ScriptingEvalThisTest.bound\n"
                        + "}).call(this);"
                );
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.arrow);
                Assert.assertEquals("object", typeof window.ScriptingEvalThisTest.bound);

                [
                    "(function() {\n#use ScriptingEvalThisTest.unbound\n})();",
                    "({method() {\n#use ScriptingEvalThisTest.method\n}}).method();"
                ].forEach(script => {
                    let error;
                    try {Scripting.eval({}, script);
                    } catch (exception) {
                        error = exception;
                    }
                    Assert.assertTrue(error instanceof TypeError);
                });
                Assert.assertUndefined(window.ScriptingEvalThisTest.unbound);
                Assert.assertUndefined(window.ScriptingEvalThisTest.method);
            } finally {
                delete window.ScriptingEvalThisTest;
            }
        }});

        Test.start({auto:true});
    </script>
  <body>
  </body>
</html>
