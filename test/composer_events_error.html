<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
      iframe {
        height: 2em;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();
        
        Test.create({test() {
            for (let loop = 1; loop <= 3; loop++) {
                let frame = document.querySelector("iframe:nth-child(" + loop + ")");
                frame = frame.contentDocument || frame.contentWindow.document;
                const text = frame.body.textContent;
                Assert.assertTrue(!!text.match(/TypeError|ReferenceError|not defined|undefined or null reference/));
            }
        }});
        
        // Must be var because the value is accessed from a frame via parent.
        // This is a window/global property; it is independent of the execution
        // scope used for expressions and composite scripts.
        var count = 0;
        let interval = window.setInterval(() => {
            if (count < 3)
                return;
            window.clearInterval(interval);
            Test.start();
        }, 250);
    </script>
  </head>
  <body>
    <iframe src="composer_events_error_1.html"></iframe>
    <iframe src="composer_events_error_2.html"></iframe>
    <iframe src="composer_events_error_3.html"></iframe>
  </body>
</html>
