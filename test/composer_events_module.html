<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">

        Test.activate();

        Composer.listen(Composer.EVENT_RENDER_END, () => {
            Test.start();
        });

        Test.create({test() {
            Assert.assertEquals(2, calls.length);
        }});

        Test.create({test() {
            const expected = "[object HTMLDivElement],nsX/a,[object HTMLDivElement],nsX/b";
            Assert.assertEquals(expected, String(calls));
        }});

        const calls = [];
        Composer.listen(Composer.EVENT_MODULE_LOAD,
            (event, context, module) => calls.push([context, module]));
    </script>
  </head>
  <body>
    <div id="a@nsX" composite></div>
    <div id="a@nsX" composite></div>
    <div id="a@nsX" composite></div>

    <div id="b@nsX" composite>1</div>
    <div id="b@nsX" composite>2</div>
    <div id="b@nsX" composite>3</div>

    <section iterate="{{entry:[1,2,3]}}">
      <div id="a@nsX" composite></div>
    </section>

    {{calls}}
  </body>
</html>
