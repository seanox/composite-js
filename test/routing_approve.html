<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Seanox composite-js Test Environment</title>
    <style>
      body {
        font-family: monospace;
      }
    </style>
    <script src="composite-js-testing.js"></script>
    <script type="text/javascript">
    
        Test.activate();

        Object.use("a.b.c");
        a.b.c.modelA = {
            permit() {
                permits += "a";
                return _snapshots.length < 3 || _snapshots.length > 7;
            }
        };

        const modelB = {
            permit() {
                permits += "b";
            }
        };

        let count = 0;
        let permits = "";
        const _snapshots = [];
        const _sequence = ["#modelA", "#modelB", "#modelC", "#modelB", "#modelA", "#modelC", "#modelA", "#modelB", "#modelC", "#modelB", "#modelA"];
        Composer.listen(Composer.EVENT_RENDER_END, () => {

            console.log(++count, window.location.hash, _snapshots.at(-1), _sequence.length);
            if (_sequence.length <= 0) {
                if (document.body.innerText.includes(_snapshots[0]))
                    return;
                document.body.innerText = _snapshots.join("\r\n");
                Test.start();
                return;
            }

            const content = document.body.innerText
                    .replace(/([\r\n]+)|(\s{2,})/g, " ")
                    .replace(/^\s*(.*?)\s*\[\s*(.*?)\s*\]\s*$/, "$2 $1");
            _snapshots.push(content);
            window.setTimeout(() => {
                permits = "";
                Routing.route(_sequence.shift());
            }, 250);
        });

        // Important are 5-9
        // In which modelB.permit() finds decisions outside the path coverage
        Test.create({test() {
            const content = _snapshots.join("\r\n");
            console.debug(content);
            Assert.assertSameTo("script[type='text/test']", content);
        }});
    </script>
    <script type="text/test">
      0: ab A
      1: #modelA ab A
      2: #modelB ab A B
      3: #modelC a
      4: #modelB ab B
      5: #modelA a
      6: #modelC ab
      7: #modelA ab
      8: #modelB ab A B
      9: #modelC a A
      10: #modelB ab A B
    </script>
  </head>
  <body route>
    <div id="modelA@a:b:c" composite route>A</div>
    <div id="modelB" composite route>B</div>
    [ {{_snapshots.length}}: {{window.location.hash}} {{permits}} ]
  </body>
</html>
